name: Geometry audit CLI

on:
  push:
    branches: [V23]
  pull_request:
    branches: [V23]
  workflow_dispatch:

jobs:
  geometry-audit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check CLI syntax
        run: node --check tools/geometry-audit-cli.js
      - name: Check CLI help
        run: node tools/geometry-audit-cli.js --help
      - name: Run geometry audit smoke test
        run: node tools/geometry-audit-cli.js --input ./tests/fixtures/geometry-audit-smoke.txt --report ./artifacts/smoke-report.json --summary ./artifacts/smoke-summary.md --fail-on none
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-audit-smoke-report
          path: |
            artifacts/smoke-report.json
            artifacts/smoke-summary.md
          if-no-files-found: ignore
