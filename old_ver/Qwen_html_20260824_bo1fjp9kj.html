<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת עימוד תורנית מקצועית לדפי A4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bellefair&family=David+Libre:wght@400;700&family=Frank+Ruhl+Libre:wght@400;700;900&family=Noto+Serif+Hebrew:wght@400;700;900&family=Assistant:wght@400;600;700&display=swap');

  :root {
    --w-margin: 7.5%;
    --w-gap: 2%;
    --w-col: 40%;
    --w-gutter: 2%;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    background-color: #5a5a5a;
    font-family: 'David Libre', serif;
    color: #000000;
    display: flex;
    flex-direction: row;
  }

  #sidebar {
    width: 520px;
    min-width: 360px;
    max-width: 750px;
    height: 100vh;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    box-shadow: -3px 0 15px rgba(0,0,0,0.3);
    z-index: 100;
    flex-shrink: 0;
  }

  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid #ddd;
    flex-shrink: 0;
  }

  .sidebar-title { font-size: 13pt; font-weight: 700; }

  .btn-load-fonts {
    background-color: #2c3e50;
    color: #fff;
    border: none;
    padding: 4px 8px;
    font-size: 8.5pt;
    font-weight: 700;
    cursor: pointer;
    border-radius: 3px;
  }

  .textarea-container {
    flex: 0 0 40%;
    min-height: 150px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid #ddd;
    flex-shrink: 0;
  }

  #raw-input {
    width: 100%;
    flex: 1;
    font-family: monospace;
    font-size: 9.5pt;
    padding: 6px;
    border: 1px solid #777;
    border-radius: 3px;
    direction: rtl;
    resize: none;
  }

  .sidebar-scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
  }

  .settings-panel {
    background: #fbfbfb;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .panel-title {
    background: #eaeaea;
    padding: 6px 10px;
    font-size: 10pt;
    font-weight: 700;
    border-bottom: 1px solid #ddd;
  }

  .panel-body {
    padding: 10px;
    font-size: 9pt;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 6px;
  }
  
  .form-group label { font-weight: 700; margin-bottom: 2px; font-size: 8.5pt; }
  
  .form-group input, .form-group select {
    padding: 3px 6px;
    border: 1px solid #aaa;
    border-radius: 3px;
    font-family: inherit;
    font-size: 9pt;
  }

  .font-row {
    display: grid;
    grid-template-columns: 80px 1fr 1fr 50px;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  
  .font-row label { font-weight: 700; font-size: 8.5pt; }
  .font-row select, .font-row input { padding: 3px; font-size: 8.5pt; width: 100%; }

  .header-row {
    display: grid;
    grid-template-columns: 70px 1fr 60px 1fr 50px;
    gap: 4px;
    align-items: center;
    margin-bottom: 6px;
  }
  .header-row label { font-weight: 700; font-size: 8pt; }
  .header-row select, .header-row input { padding: 2px; font-size: 8pt; width: 100%; }

  .toc-levels-config {
    background: #f0f0f0;
    padding: 6px;
    border-radius: 3px;
    margin-bottom: 8px;
  }
  
  .toc-level-row {
    display: grid;
    grid-template-columns: 40px 50px 1fr 50px;
    gap: 4px;
    align-items: center;
    margin-bottom: 3px;
    font-size: 8.5pt;
  }
  .toc-level-row label { font-weight: 700; display: flex; align-items: center; gap: 2px; cursor: pointer; }
  .toc-level-row select, .toc-level-row input { padding: 2px; font-size: 8pt; width: 100%; }

  .proportions-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .prop-item { display: flex; justify-content: space-between; align-items: center; }
  .prop-item label { font-weight: 700; font-size: 8.5pt; }
  .prop-item input { width: 60px; padding: 3px; text-align: center; font-size: 9pt; }

  .btn-bar-bottom {
    display: flex;
    gap: 6px;
    padding: 10px 14px;
    border-top: 1.5px solid #ccc;
    background: #fff;
    flex-shrink: 0;
  }
  .btn-primary {
    background-color: #000;
    color: #fff;
    border: none;
    padding: 8px 12px;
    font-size: 10pt;
    font-weight: 700;
    cursor: pointer;
    border-radius: 3px;
    flex-grow: 1;
  }
  .btn-save-template {
    background-color: #1e3a8a;
    color: #fff;
    border: none;
    padding: 8px 10px;
    font-size: 9.5pt;
    font-weight: 700;
    cursor: pointer;
    border-radius: 3px;
  }
  .btn-secondary {
    background-color: #f0f0f0;
    color: #000;
    border: 1px solid #666;
    padding: 8px 10px;
    font-size: 9.5pt;
    cursor: pointer;
    border-radius: 3px;
  }

  #resizer {
    width: 6px;
    height: 100vh;
    background: #333333;
    cursor: col-resize;
    flex-shrink: 0;
    z-index: 110;
  }
  #resizer:hover, #resizer.resizing { background: #b8860b; }

  #preview-pane {
    flex-grow: 1;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 25px 20px;
    scroll-behavior: smooth;
    background-color: #5a5a5a;
  }

  .a4-page {
    background-color: #ffffff;
    width: 210mm;
    height: 297mm;
    max-height: 297mm;
    padding: 15mm;
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
    position: relative;
    margin-bottom: 30px;
    page-break-after: always;
    overflow: hidden;
    flex-shrink: 0;
  }

  .main-shaar-page { display: flex; justify-content: center; align-items: center; position: relative; padding: 0; }
  .shaar-main-content {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    justify-content: space-between; align-items: center; text-align: center;
    padding: 20mm 12mm 16mm 12mm; z-index: 20; position: relative;
  }
  .bsd-header { font-family: 'David Libre', serif; font-size: 11pt; font-weight: 700; color: #444; }
  .sefer-label { font-family: 'David Libre', serif; font-size: 15pt; letter-spacing: 5px; font-weight: 700; margin-top: 4px; }
  .book-title-main { line-height: 1.1; margin: 10px 0 4px 0; }
  .book-subtitle { font-weight: 700; line-height: 1.25; }
  .book-description { line-height: 1.5; max-width: 65%; margin: 10px auto; }
  .book-sections-summary { line-height: 1.5; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; padding: 6px 12px; margin: 8px 0; font-weight: 700; }
  .author-block { line-height: 1.3; }
  .author-name { font-size: 15pt; font-weight: 700; }
  .publication-footer { font-weight: 700; letter-spacing: 1px; }

  .m1-bg-top { position: absolute; top: 0; left: 0; right: 0; height: 20%; background: linear-gradient(135deg, #f2f2f2 0%, #e2e2e2 100%); border-bottom: 1px solid #d0d0d0; }
  .m1-bg-middle { position: absolute; top: 20%; left: 0; right: 0; height: 60%; background: #ffffff; }
  .m1-bg-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 20%; background: linear-gradient(135deg, #f2f2f2 0%, #e2e2e2 100%); border-top: 1px solid #d0d0d0; }
  .m1-panel { position: absolute; top: 0; bottom: 0; left: 12%; right: 12%; background: #ffffff; border-right: 1px solid #ccc; border-left: 1px solid #ccc; box-shadow: 0 0 20px rgba(0,0,0,0.1); display: flex; justify-content: space-between; z-index: 10; }
  .m1-damask { width: 30px; height: 100%; background: #fafafa url("data:image/svg+xml,%3Csvg width='32' height='55' viewBox='0 0 32 55' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M16,27 C10,22 5,14 5,5 C5,0 10,0 16,5 C22,0 27,0 27,5 C27,14 22,22 16,27 Z M16,27 C10,32 5,40 5,49 C5,55 10,55 16,49 C22,55 27,55 27,49 C27,40 22,32 16,27 Z M16,14 A3.5,3.5 0 1,0 16,21 A3.5,3.5 0 1,0 16,14 Z' fill='%239e9e9e' fill-opacity='0.35'/%3E%3C/svg%3E") repeat-y; flex-shrink: 0; }
  .m2-bg-top { position: absolute; top: 0; left: 0; right: 0; height: 18%; background: #eaeaea; }
  .m2-bg-middle { position: absolute; top: 18%; left: 0; right: 0; height: 64%; background: #ffffff; box-shadow: inset 0 2px 6px rgba(0,0,0,0.06), inset 0 -2px 6px rgba(0,0,0,0.06); }
  .m2-bg-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 18%; background: #eaeaea; }
  .m2-panel { position: absolute; top: 0; bottom: 0; left: 10%; right: 10%; background: #ffffff; box-shadow: 0 0 25px rgba(0,0,0,0.12); display: flex; justify-content: space-between; z-index: 10; }
  .m2-lace { width: 24px; height: 100%; background: #ffffff url("data:image/svg+xml,%3Csvg width='26' height='40' viewBox='0 0 26 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M13,20 C4,16 2,8 2,2 C2,0 8,0 13,8 C18,0 24,0 24,2 C24,8 22,16 13,20 Z M13,20 C4,24 2,32 2,38 C2,40 8,40 13,32 C18,40 24,40 24,38 C24,32 22,24 13,20 Z M13,10 A3,3 0 1,0 13,16 A3,3 0 1,0 13,10 Z M13,30 A3,3 0 1,0 13,24 A3,3 0 1,0 13,30 Z' fill='%23888888' fill-opacity='0.45'/%3E%3C/svg%3E") repeat-y; flex-shrink: 0; }
  .m3-wavy-band { position: absolute; top: 14%; left: 0; right: 0; height: 72%; background: #ffffff; border-top: 1.5px solid #d4d4d4; border-bottom: 1.5px solid #d4d4d4; }
  .m3-panel { position: absolute; top: 0; bottom: 0; left: 9%; right: 9%; background: #ffffff; border-right: 1.5px solid #ccc; border-left: 1.5px solid #ccc; box-shadow: 0 0 25px rgba(0,0,0,0.14); z-index: 10; }
  .m3-corner { position: absolute; width: 65px; height: 65px; fill: #111; z-index: 25; }
  .m3-corner.tr { top: 10mm; right: 10mm; }
  .m3-corner.tl { top: 10mm; left: 10mm; transform: scaleX(-1); }
  .m3-corner.br { bottom: 10mm; right: 10mm; transform: scaleY(-1); }
  .m3-corner.bl { bottom: 10mm; left: 10mm; transform: scale(-1, -1); }

  .sub-shaar-page { position: relative; padding: 0; }
  .sub-shaar-col { position: absolute; top: 0; bottom: 0; left: 0; right: auto; width: 55%; background: #ffffff; border-right: 1.5px solid #ccc; box-shadow: 5px 0 18px rgba(0,0,0,0.08); display: flex; z-index: 10; }
  .sub-shaar-bg-right { position: absolute; top: 0; bottom: 0; right: 0; left: 55%; background: #f4f4f4; }
  .sub-shaar-content-centered { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20mm 12mm; }

  .toc-page { padding: 15mm; display: flex; flex-direction: column; }
  .toc-grid-full { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 175mm; margin: 0 auto; flex-grow: 1; justify-content: space-between; }
  .toc-grid-full.toc-last-page { justify-content: flex-start; flex-grow: 0; }
  
  .toc-group { break-inside: avoid; page-break-inside: avoid; margin-bottom: 4px; }
  
  .toc-item { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px; font-family: 'David Libre', serif; font-size: 10.5pt; break-inside: avoid; }
  .toc-title { flex-shrink: 1; max-width: 84%; font-weight: 600; white-space: normal; word-wrap: break-word; overflow-wrap: break-word; text-align: right; line-height: 1.3; }
  .toc-dots { flex-grow: 1; border-bottom: 1px dotted #777; margin: 0 8px; height: 1px; min-width: 25px; }
  .toc-page-num { flex-shrink: 0; font-weight: 700; font-family: 'David Libre', serif; font-size: 10.5pt; min-width: 25px; text-align: left; }
  .toc-grouped-page { color: #555555 !important; }

  .toc-lvl-1 { font-size: 12pt; font-weight: 700; margin-top: 10px; margin-bottom: 4px; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
  .toc-lvl-2 { font-size: 11pt; font-weight: 700; margin-top: 6px; padding-right: 8px; }
  .toc-lvl-3 { font-size: 10.5pt; font-weight: 700; padding-right: 16px; }
  .toc-lvl-4 { padding-right: 24px; }
  .toc-lvl-5 { padding-right: 32px; }
  .toc-lvl-6 { padding-right: 40px; }

  .toc-lvl-7-inline-block { padding-right: 48px; font-size: 8.8pt; color: #333; line-height: 1.45; margin: 2px 0 6px 0; text-align: justify; font-family: 'David Libre', serif; }
  .toc-lvl-7-inline-block .l7-title { font-weight: 600; color: #222; }
  .toc-lvl-7-inline-block .l7-page { font-weight: 700; color: #555; }
  .toc-lvl-7-inline-block .l7-sep { color: #888; margin: 0 5px; font-weight: bold; }

  .top-header-grid { display: grid; grid-template-columns: var(--w-margin) var(--w-gap) var(--w-col) var(--w-gutter) var(--w-col) var(--w-gap) var(--w-margin); align-items: center; margin-bottom: 24px; height: 24px; flex-shrink: 0; }
  .header-right-col { grid-column: 3; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-center-ornament { grid-column: 4; display: flex; justify-content: center; align-items: center; width: 100%; overflow: visible; }
  .header-left-col { grid-column: 5; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .title-level-2-standalone { font-weight: 700; text-align: center; margin-top: 110px; margin-bottom: 40px; width: 100%; line-height: 1.25; flex-shrink: 0; }

  .page-body-flow { display: flex; flex-direction: column; width: 100%; min-height: 875px; max-height: 875px; position: relative; }
  .page-body-flow.has-h2 { min-height: 660px; max-height: 660px; }

  .block-2col { display: grid; grid-template-columns: var(--w-margin) var(--w-gap) var(--w-col) var(--w-gutter) var(--w-col) var(--w-gap) var(--w-margin); width: 100%; position: relative; align-items: start; }
  .block-h3-span { display: flex; justify-content: center; align-items: center; width: 100%; padding: 10px 0 6px 0; margin-bottom: 4px; flex-shrink: 0; }
  .block-h3-span .h3-title-text { font-weight: 900; text-align: center; width: 100%; line-height: 1.22; }

  .title-level-0, .title-level-1, .title-level-2, .title-level-3, .title-level-4, .title-level-5, .title-level-6, .title-level-7 { text-align: center; margin: 8px 0; line-height: 1.22; }
  .title-level-4 { font-weight: 900; margin: 9px 0 4px 0; }
  .title-level-5 { font-weight: 700; margin: 7px 0 3px 0; }
  .title-level-6 { font-weight: 700; margin: 6px 0 3px 0; }

  .block-single-col { display: grid; grid-template-columns: var(--w-margin) var(--w-gap) calc(var(--w-col)*2 + var(--w-gutter)) var(--w-gap) var(--w-margin); width: 100%; position: relative; align-items: start; }
  .block-single-col .single-wide-col { grid-column: 3; line-height: 1.45; text-align: justify; text-justify: inter-word; }

  .margin-notes-column { line-height: 1.18; text-align: center; text-align-last: center; font-weight: 400; color: #404040; position: relative; width: 100%; height: 100%; }
  .right-margin { grid-column: 1; }
  .left-margin { grid-column: 7; }
  .side-note-anchor { position: absolute; width: 100%; }

  .main-column { line-height: 1.34; text-align: justify; text-justify: inter-word; min-height: 0; height: auto; position: relative; }
  .right-col { grid-column: 3; }
  .left-col { grid-column: 5; }

  p { margin-bottom: 7px; text-align: justify; text-justify: inter-word; position: relative; }
  p.p-end { text-align-last: center; }
  p.p-cut { text-align-last: justify; }

  .first-word-window { float: right; font-weight: 900; line-height: 0.85; height: 1.25em; margin-left: 6px; margin-bottom: 1px; display: block; }

  .page-number-footer { position: absolute; bottom: 14mm; left: 0; right: 0; text-align: center; font-size: 12pt; font-weight: 700; height: 20px; }

  #measuring-box { position: absolute; visibility: hidden; pointer-events: none; top: -9999px; left: -9999px; line-height: 1.34; }

  @media print {
    body { background: none; padding: 0; overflow: visible; display: block; }
    #sidebar, #resizer { display: none !important; }
    #preview-pane { height: auto !important; overflow: visible !important; padding: 0 !important; background: none !important; }
    .a4-page { box-shadow: none; width: 100%; height: 100%; min-height: 100vh; max-height: 100vh; padding: 15mm; margin: 0; page-break-after: always; }
  }
</style>
<style id="dynamic-styles"></style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">מערכת עימוד תורנית A4</div>
      <button class="btn-load-fonts" onclick="loadSystemFonts()">📂 טען גופני Windows</button>
    </div>

    <div class="textarea-container">
      <textarea id="raw-input" placeholder="הדבק כאן את הטקסט המלא..."></textarea>
    </div>

    <div class="sidebar-scroll-area">
      
      <div class="settings-panel">
        <div class="panel-title">👑 הגדרות שער ראשי ושערי משנה</div>
        <div class="panel-body">
          <div class="form-group"><label><input type="checkbox" id="show-main-shaar" checked> הצג שער ראשי בראש הספר</label></div>
          <div class="form-group">
            <label>סגנון שער ראשי:</label>
            <select id="main-shaar-style">
              <option value="1" selected>1. דמסק ושיש מרכזי</option>
              <option value="2">2. תחרת סלסולים כפולה</option>
              <option value="3">3. קרנות וילנא וגיליושה</option>
            </select>
          </div>
          
          <div class="font-row"><label>שם הספר:</label><input type="text" id="inp-book-title" value=""><select id="font-book-title" class="font-picker"></select><input type="number" id="size-book-title" value="50"></div>
          <div class="font-row"><label>כותרת משנה:</label><input type="text" id="inp-book-subtitle" value=""><select id="font-book-subtitle" class="font-picker"></select><input type="number" id="size-book-subtitle" value="28"></div>
          <div class="font-row"><label>תיאור מפורט:</label><input type="text" id="inp-book-desc" value=""><select id="font-book-desc" class="font-picker"></select><input type="number" id="size-book-desc" value="12"></div>
          <div class="font-row"><label>פרטי חלקים:</label><input type="text" id="inp-book-sections" value=""><select id="font-book-sections" class="font-picker"></select><input type="number" id="size-book-sections" value="11.5"></div>
          <div class="font-row"><label>שם המחבר:</label><input type="text" id="inp-book-author" value=""><select id="font-book-author" class="font-picker"></select><input type="number" id="size-book-author" value="13"></div>
          <div class="font-row"><label>מקום ושנה:</label><input type="text" id="inp-book-year" value=""><select id="font-book-year" class="font-picker"></select><input type="number" id="size-book-year" value="12"></div>

          <hr style="margin: 10px 0;">
          <div class="form-group">
            <label>סגנון שערי משנה (כותרת 1):</label>
            <select id="sub-shaar-style">
              <option value="1" selected>1. דמסק שמאלי</option>
              <option value="2">2. תחרה שמאלית</option>
              <option value="3">3. קרנות וילנא שמאליות</option>
            </select>
          </div>
          <div class="form-group">
            <label>עיטור סיום פרק:</label>
            <select id="section-divider-style">
              <option value="pyramid" selected>1. פירמידת וילנא (❖ ❖ ❖)</option>
              <option value="spear">2. רומח מחודד עם טבעת (SVG)</option>
              <option value="swash">3. שושנתא וילנאית (SVG)</option>
              <option value="flourish">4. סלסול תורני כפול (SVG)</option>
              <option value="none">ללא עיטור</option>
            </select>
          </div>
        </div>
      </div>

      <div class="settings-panel">
        <div class="panel-title">⚙️ אופן עימוד וגופנים לכותרות (0-7)</div>
        <div class="panel-body" id="layout-panel-body">
          <!-- Generated by JS -->
        </div>
      </div>

      <div class="settings-panel">
        <div class="panel-title">📖 כותרות עליונות</div>
        <div class="panel-body" id="headers-panel-body">
          <!-- Generated by JS -->
        </div>
      </div>

      <div class="settings-panel">
        <div class="panel-title">📑 תוכן עניינים</div>
        <div class="panel-body">
          <div class="form-group"><label><input type="checkbox" id="enable-general-toc" checked> הצג תוכן עניינים כללי בראש הספר</label></div>
          <div class="toc-levels-config" id="gtoc-config"></div>

  <script>
    const defaultFonts = [
      "'David Libre', 'David', serif",
      "'Frank Ruhl Libre', 'FrankRuehl', serif",
      "'Noto Serif Hebrew', serif",
      "'Bellefair', serif",
      "'Assistant', sans-serif",
      "'Lia Sgula', 'Bellefair', serif",
      "'AAd_AlphaBlack', 'David Libre', serif",
      "'AAd_AlphaLight', 'Noto Serif Hebrew', serif",
      "'Hadassah Friedlaender', 'Hadassah', serif",
      "'Rashi DP', 'Frank Ruhl Libre', serif"
    ];

    function initFontPickers() {
      document.querySelectorAll('.font-picker').forEach(select => {
        select.innerHTML = '';
        defaultFonts.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f;
          opt.textContent = f.split(',')[0].replace(/'/g, '');
          select.appendChild(opt);
        });
      });
    }

    function initLayouts() {
      const panel = document.getElementById('layout-panel-body');
      const layouts = [
        { val: 'continuous', text: 'עימוד רציף' },
        { val: 'single-col', text: 'טור אחד' },
        { val: 'new-page', text: 'עמוד חדש' },
        { val: 'side', text: 'כותרת צד' }
      ];
      
      let html = '';
      for(let i=0; i<=7; i++) {
        let defaultLayout = 'continuous';
        if(i === 0) defaultLayout = 'single-col';
        if(i === 1) defaultLayout = 'new-page';
        if(i === 2) defaultLayout = 'new-page';
        if(i === 3) defaultLayout = 'single-col';
        if(i === 7) defaultLayout = 'side';

        let defaultSize = 11;
        if(i===0) defaultSize = 14;
        if(i===1) defaultSize = 50;
        if(i===2) defaultSize = 17;
        if(i===3) defaultSize = 13.5;
        if(i===4) defaultSize = 12.5;
        if(i===5) defaultSize = 11.5;
        if(i===6) defaultSize = 10.5;
        if(i===7) defaultSize = 6;

        html += `<div class="font-row">
          <label>כותרת ${i}:</label>
          <select id="layout-h${i}">
            ${layouts.map(l => `<option value="${l.val}" ${l.val === defaultLayout ? 'selected' : ''}>${l.text}</option>`).join('')}
          </select>
          <select id="font-h${i}" class="font-picker"></select>
          <input type="number" id="size-h${i}" value="${defaultSize}" step="0.5">
        </div>`;
      }
      panel.innerHTML = html;
    }

    function initHeaders() {
      const panel = document.getElementById('headers-panel-body');
      const areas = [
        { id: 'right', label: 'מעל טור ימני' },
        { id: 'center', label: 'מעל רווח מרכזי' },
        { id: 'left', label: 'מעל טור שמאלי' }
      ];
      const contents = [
        { val: 'h1', text: 'כותרת 1 (שם החלק)' },
        { val: 'h2', text: 'כותרת 2 (פרק)' },
        { val: 'h3', text: 'כותרת 3' },
        { val: 'book', text: 'שם הספר' },
        { val: 'custom', text: 'מותאם אישית' },
        { val: 'diamonds', text: 'מעויינים (◈ ❖ ◈)' },
        { val: 'spear', text: 'רומח (SVG)' },
        { val: 'swash', text: 'שושנתא (SVG)' },
        { val: 'pen', text: 'סלסול (SVG)' },
        { val: 'none', text: 'ריק' }
      ];
      
      let html = '';
      areas.forEach(area => {
        html += `<div style="margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 6px;">
          <label style="font-weight: 700; display: block; margin-bottom: 4px;">${area.label}:</label>
          <div class="header-row">
            <select id="top-content-${area.id}" onchange="toggleCustomHeader('${area.id}')">
              ${contents.map(c => `<option value="${c.val}">${c.text}</option>`).join('')}
            </select>
            <input type="text" id="top-custom-${area.id}" placeholder="הזן טקסט" style="display:none;">
            <select id="top-align-${area.id}">
              <option value="right">ימין</option>
              <option value="center" selected>מרכז</option>
              <option value="left">שמאל</option>
            </select>
            <select id="font-top-${area.id}" class="font-picker"></select>
            <input type="number" id="size-top-${area.id}" value="13" step="0.5">
          </div>
        </div>`;
      });
      panel.innerHTML = html;
    }

    function initTOCConfigs() {
      const gtoc = document.getElementById('gtoc-config');
      const dtoc = document.getElementById('dtoc-config');
      
      let htmlG = '<div style="font-size: 8pt; font-weight: 700; margin-bottom: 4px;">רמות בתוכן הכללי:</div>';
      let htmlD = '<div style="font-size: 8pt; font-weight: 700; margin-bottom: 4px;">רמות בתוכן המפורט:</div>';
      
      for(let i=1; i<=7; i++) {
        const gChecked = (i <= 6) ? 'checked' : '';
        const dChecked = (i >= 2) ? 'checked' : '';
        
        htmlG += `<div class="toc-level-row">
          <label><input type="checkbox" class="gtoc-lvl" value="${i}" ${gChecked}> הצג</label>
          <label><input type="checkbox" class="gtoc-group" value="${i}"> קיבוץ</label>
          <select id="font-gtoc-${i}" class="font-picker"></select>
          <input type="number" id="size-gtoc-${i}" value="${14 - i}" step="0.5">
        </div>`;
        
        htmlD += `<div class="toc-level-row">
          <label><input type="checkbox" class="dtoc-lvl" value="${i}" ${dChecked}> הצג</label>
          <label><input type="checkbox" class="dtoc-group" value="${i}"> קיבוץ</label>
          <select id="font-dtoc-${i}" class="font-picker"></select>
          <input type="number" id="size-dtoc-${i}" value="${14 - i}" step="0.5">
        </div>`;
      }
      gtoc.innerHTML = htmlG;
      dtoc.innerHTML = htmlD;
    }

    function toggleCustomHeader(id) {
      const sel = document.getElementById(`top-content-${id}`);
      const inp = document.getElementById(`top-custom-${id}`);
      inp.style.display = (sel.value === 'custom') ? 'block' : 'none';
    }

    function initAll() {
      initFontPickers();
      initLayouts();
      initHeaders();
      initTOCConfigs();
      loadSystemFonts();
    }

    const resizer = document.getElementById('resizer');
    const sidebar = document.getElementById('sidebar');
    let isResizing = false;

    resizer.addEventListener('mousedown', () => {
      isResizing = true;
      resizer.classList.add('resizing');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const newWidth = document.body.clientWidth - e.clientX;
      if (newWidth >= 360 && newWidth <= 750) sidebar.style.width = newWidth + 'px';
    });

    window.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('resizing');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    function saveAsDefaultTemplate() {
      document.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => input.setAttribute('value', input.value));
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        if (cb.checked) cb.setAttribute('checked', 'checked');
        else cb.removeAttribute('checked');
      });
      document.querySelectorAll('select').forEach(sel => {
        Array.from(sel.options).forEach(opt => {
          if (opt.value === sel.value) opt.setAttribute('selected', 'selected');
          else opt.removeAttribute('selected');
        });
      });
      const rawInputElem = document.getElementById('raw-input');
      const prevVal = rawInputElem.value;
      rawInputElem.innerHTML = '';
      rawInputElem.value = '';
      const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      rawInputElem.value = prevVal;
      const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'torani-typesetting-template.html';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function loadSystemFonts() {
      if ('queryLocalFonts' in window) {
        try {
          const availableFonts = await window.queryLocalFonts();
          const fontFamilies = [...new Set(availableFonts.map(f => f.family))].sort((a, b) => a.localeCompare(b, 'he'));
          if (fontFamilies.length > 0) {
            document.querySelectorAll('.font-picker').forEach(select => {
              const currentVal = select.value;
              const sysGroup = document.createElement('optgroup');
              sysGroup.label = `גופני מחשב (${fontFamilies.length})`;
              fontFamilies.forEach(family => {
                const opt = document.createElement('option');
                opt.value = `'${family}', serif`;
                opt.textContent = family;
                if (currentVal.includes(family)) opt.selected = true;
                sysGroup.appendChild(opt);
              });
              select.appendChild(sysGroup);
            });
          }
        } catch (err) {}
      }
    }

    function toGematria(num) {
      num = parseInt(num, 10);
      if (isNaN(num) || num <= 0) return "";
      if (num === 15) return "טו";
      if (num === 16) return "טז";
      const hundreds = ["", "ק", "ר", "ש", "ת", "תק", "תר", "תש", "תת", "תתק"];
      const tens = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
      const ones = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
      let str = "";
      let h = Math.floor(num / 100);
      if (h > 0) {
        if (h <= 4) str += ["", "ק", "ר", "ש", "ת"][h];
        else if (h < hundreds.length) str += hundreds[h];
        num %= 100;
      }
      let t = Math.floor(num / 10);
      let o = num % 10;
      if (t === 1 && (o === 5 || o === 6)) str += (o === 5) ? "טו" : "טז";
      else str += tens[t] + ones[o];
      return str;
    }

    function updateGrid() {
      const root = document.documentElement;
      root.style.setProperty('--w-col', document.getElementById('prop-col').value + '%');
      root.style.setProperty('--w-margin', document.getElementById('prop-margin').value + '%');
      root.style.setProperty('--w-gutter', document.getElementById('prop-gutter').value + '%');
      root.style.setProperty('--w-gap', document.getElementById('prop-gap').value + '%');
    }

    function getSize(id) { return document.getElementById(id).value; }

      let css = '';
      css += `.book-title-main { font-family: ${getFont('font-book-title')}; font-size: ${getSize('size-book-title')}pt; }\n`;
      css += `.book-subtitle { font-family: ${getFont('font-book-subtitle')}; font-size: ${getSize('size-book-subtitle')}pt; }\n`;
      css += `.book-description { font-family: ${getFont('font-book-desc')}; font-size: ${getSize('size-book-desc')}pt; }\n`;

      document.getElementById('dynamic-styles').textContent = css;
    }

    function createDropWord(text, isContinuation) {
      if (isContinuation) return text;
      text = text.trim();
      const firstSpace = text.indexOf(' ');
      if (firstSpace === -1) return `<span class="first-word-window">${text}</span>`;
      const firstWord = text.substring(0, firstSpace);
      const rest = text.substring(firstSpace + 1);
      return `<span class="first-word-window">${firstWord}</span> ${rest}`;
    }

    function stretchColumn(col, targetH) {
      const currentH = col.scrollHeight;
      const diff = targetH - currentH;
      if (diff < 2) return;
      const paragraphs = col.querySelectorAll('p');
      if (paragraphs.length > 0) {
        const extraPerP = diff / paragraphs.length;
        paragraphs.forEach(p => {
          const curMB = parseFloat(getComputedStyle(p).marginBottom) || 0;
          p.style.marginBottom = (curMB + extraPerP) + 'px';
        });
      } else {
        const curLH = parseFloat(getComputedStyle(col).lineHeight) || 16;
        col.style.lineHeight = (curLH + diff) + 'px';
      }
    }

    function parseMetadataFromText(rawText) {
      const lines = rawText.split('\n');
      const cleanLines = [];
      for (let line of lines) {
        const trimmed = line.trim();
        let match = false;
        if (/^(?:שם הספר[:\s]*)?שם הספר\s*[-–—:]\s*(.*)$/i.test(trimmed)) { document.getElementById('inp-book-title').value = trimmed.replace(/^(?:שם הספר[:\s]*)?שם הספר\s*[-–—:]\s*/i, '').trim(); match = true; }
        else if (/^(?:נושא(?:\\|\/)כותרת משנה[:\s]*)?נושא\s*[-–—:]\s*(.*)$/i.test(trimmed)) { document.getElementById('inp-book-subtitle').value = trimmed.replace(/^(?:נושא(?:\\|\/)כותרת משנה[:\s]*)?נושא\s*[-–—:]\s*/i, '').trim(); match = true; }
        else if (/^(?:נושא מפורט\s*(?:\\|\/)\s*תיאור[:\s]*)?נושא מפורט\s*[-–—:]\s*(.*)$/i.test(trimmed)) { document.getElementById('inp-book-desc').value = trimmed.replace(/^(?:נושא מפורט\s*(?:\\|\/)\s*תיאור[:\s]*)?נושא מפורט\s*[-–—:]\s*/i, '').trim(); match = true; }
        else if (/^(?:פרטי מהדורא\s*(?:\\|\/)\s*חלקים[:\s]*)?פרטי מהדורא\s*[-–—:]\s*(.*)$/i.test(trimmed)) { document.getElementById('inp-book-sections').value = trimmed.replace(/^(?:פרטי מהדורא\s*(?:\\|\/)\s*חלקים[:\s]*)?פרטי מהדורא\s*[-–—:]\s*/i, '').trim(); match = true; }
        else if (/^(?:שם המחבר[:\s]*)?שם המחבר\s*[-–—:]\s*(.*)$/i.test(trimmed)) { document.getElementById('inp-book-author').value = trimmed.replace(/^(?:שם המחבר[:\s]*)?שם המחבר\s*[-–—:]\s*/i, '').trim(); match = true; }
        else if (/^(?:מקום ושנת הוצאה[:\s]*)?מקום ושנת הוצאה\s*[-–—:]\s*(.*)$/i.test(trimmed)) { document.getElementById('inp-book-year').value = trimmed.replace(/^(?:מקום ושנת הוצאה[:\s]*)?מקום ושנת הוצאה\s*[-–—:]\s*/i, '').trim(); match = true; }
        if (!match) cleanLines.push(line);
      }
      return cleanLines.join('\n');
    }

    function typesetDocument() {
      updateGrid();
      updateStyles();
      let rawText = document.getElementById('raw-input').value;
      if (!rawText.trim()) return;
      rawText = parseMetadataFromText(rawText);
      const container = document.getElementById('book-container');
      container.innerHTML = '';
      const lines = rawText.split('\n');
      const tokens = [];
      let pendingSideNote = null;

      for (let lineIdx = 0; lineIdx < lines.length; lineIdx++) {
        const line = lines[lineIdx].trim();
        if (!line) continue;
        const hMatch = line.match(/^כותרת\s*(\d+)\s*(?:מספר\s*\d+)?\s*[-–—]\s*(.*)$/);
        if (hMatch) {
          const lvl = parseInt(hMatch[1], 10);
          const txt = hMatch[2].trim();
          if (lvl === 7) { pendingSideNote = txt; }
          else { tokens.push({ id: tokens.length, type: 'h' + lvl, level: lvl, text: txt }); }
        } else {
          tokens.push({ id: tokens.length, type: 'p', text: line, sideNote: pendingSideNote });
          pendingSideNote = null;
        }
      }

      const sections = [];
      let currentSection = { type: 'body', tokens: [] };
      tokens.forEach(t => {
        if (t.type === 'h1') {
          if (currentSection.tokens.length > 0) sections.push(currentSection);
          sections.push({ type: 'h1', token: t, tokens: [] });
          currentSection = { type: 'body', tokens: [] };
        } else if (t.type === 'h2' || t.type === 'h0') {
          if (currentSection.tokens.length > 0) sections.push(currentSection);
          currentSection = { type: t.type, h2Token: t, tokens: [] };
        } else {
          currentSection.tokens.push(t);
        }
      });
      if (currentSection.tokens.length > 0 || currentSection.type === 'h2' || currentSection.type === 'h0') sections.push(currentSection);

      const gtocLevels = Array.from(document.querySelectorAll('.gtoc-lvl:checked')).map(cb => parseInt(cb.value, 10));
      const dtocLevels = Array.from(document.querySelectorAll('.dtoc-lvl:checked')).map(cb => parseInt(cb.value, 10));
      const gtocGroups = Array.from(document.querySelectorAll('.gtoc-group:checked')).map(cb => parseInt(cb.value, 10));
      const dtocGroups = Array.from(document.querySelectorAll('.dtoc-group:checked')).map(cb => parseInt(cb.value, 10));

      const headingPageMap = {};
      let pageIndex = 1;
      let currentH1Title = '';
      let currentH2Title = '';
      const bookTitle = document.getElementById('inp-book-title').value || "ספר";
      const showMainShaar = document.getElementById('show-main-shaar').checked;
      const mainShaarStyle = document.getElementById('main-shaar-style').value;
      const subShaarStyle = document.getElementById('sub-shaar-style').value;
      const secDivStyle = document.getElementById('section-divider-style').value;
      const enableGeneralTOC = document.getElementById('enable-general-toc').checked;
      const enableDetailedTOC = document.getElementById('enable-detailed-toc').checked;

      if (showMainShaar) renderMainShaar(container, mainShaarStyle);

      if (enableGeneralTOC) {
        const generalTocEntries = buildStructuredTOC(tokens, gtocLevels, gtocGroups);
        pageIndex += renderPaginatedTOC(container, generalTocEntries, "תוכן העניינים הכללי", bookTitle, "תוכן העניינים הכללי", pageIndex, headingPageMap, 'general');
      }

      for (let sIdx = 0; sIdx < sections.length; sIdx++) {
        const sec = sections[sIdx];
        if (sec.type === 'h1') {
          renderSubShaar(container, sec.token, subShaarStyle);
          currentH1Title = sec.token.text.split(/[-–—]/)[0].trim();
          headingPageMap[sec.token.id] = toGematria(pageIndex);
          if (enableDetailedTOC) {
            let inThisH1 = false;
            const thisH1Tokens = [];
            for (let t of tokens) {
              if (t.id === sec.token.id) { inThisH1 = true; continue; }
              if (inThisH1 && t.type === 'h1') break;
              if (inThisH1) thisH1Tokens.push(t);
            }
            const detailedTocEntries = buildStructuredTOC(thisH1Tokens, dtocLevels, dtocGroups);
            pageIndex += renderPaginatedTOC(container, detailedTocEntries, "מפתח ולוח עניינים מפורט", currentH1Title, "תוכן העניינים המפורט", pageIndex, headingPageMap, 'detailed');
          }
          continue;
        }

        const isH0 = (sec.type === 'h0');
        let isFirstPage = true;
        let h2Text = (sec.type === 'h2' || sec.type === 'h0') ? sec.h2Token.text : '';
        let h2Id = (sec.type === 'h2' || sec.type === 'h0') ? sec.h2Token.id : undefined;
        if (h2Text) {
          currentH2Title = h2Text;
          headingPageMap[h2Id] = toGematria(pageIndex);
        }

        let secTokens = sec.tokens.slice();
        let tokenIndex = 0;
        let pendingWordTokens = null;

        while (tokenIndex < secTokens.length || pendingWordTokens) {
          let pageLayout = createPageLayout(container, isFirstPage ? h2Text : '', isFirstPage ? h2Id : undefined, pageIndex, currentH1Title, currentH2Title);
          pageIndex++;
          isFirstPage = false;
          let remPageHeight = pageLayout.maxColHeight;

          if (isH0) {
            const singleBlock = document.createElement('div');
            singleBlock.className = 'block-single-col';
            singleBlock.innerHTML = `<div class="single-wide-col"></div>`;
            pageLayout.bodyFlow.appendChild(singleBlock);
            const targetCol = singleBlock.querySelector('.single-wide-col');
            while (tokenIndex < secTokens.length || pendingWordTokens) {
              if (targetCol.scrollHeight >= remPageHeight - 10 && targetCol.children.length > 0) break;
              let currentTok = pendingWordTokens ? pendingWordTokens.token : secTokens[tokenIndex];
              if (currentTok.type.startsWith('h')) {
                const hElem = document.createElement('div');
                hElem.className = `title-level-${currentTok.level}`;
                hElem.textContent = currentTok.text;
                hElem.setAttribute('data-token-id', currentTok.id);
                targetCol.appendChild(hElem);
                headingPageMap[currentTok.id] = toGematria(pageIndex - 1);
                tokenIndex++;
                continue;
              }
              if (currentTok.type === 'p') {
                let words = pendingWordTokens ? pendingWordTokens.remainingWords : currentTok.text.split(' ');
                let isContinuation = pendingWordTokens ? true : false;
                const pElem = document.createElement('p');
                pElem.setAttribute('data-token-id', currentTok.id);
                targetCol.appendChild(pElem);
                let low = 1, high = words.length, bestFit = 0;
                while (low <= high) {
                  let mid = Math.floor((low + high) / 2);
                  pElem.innerHTML = createDropWord(words.slice(0, mid).join(' '), isContinuation);
                  if (pElem.scrollHeight <= remPageHeight) { bestFit = mid; low = mid + 1; } else { high = mid - 1; }
                }
                if (bestFit === 0 && targetCol.children.length > 1) { targetCol.removeChild(pElem); break; }
                if (bestFit === 0) bestFit = Math.min(10, words.length);
                
                // Ensure we don't split a line
                while(bestFit > 1) {
                   pElem.innerHTML = createDropWord(words.slice(0, bestFit).join(' '), isContinuation);
                   const h1 = pElem.scrollHeight;
                   pElem.innerHTML = createDropWord(words.slice(0, bestFit - 1).join(' '), isContinuation);
                   const h2 = pElem.scrollHeight;
                   if(h1 === h2) bestFit--; else break;
                }

                const chunk = words.slice(0, bestFit).join(' ');
                const isEndOfP = (bestFit >= words.length);
                pElem.className = isEndOfP ? 'p-end' : 'p-cut';
                pElem.innerHTML = createDropWord(chunk, isContinuation);
                if (isEndOfP) { pendingWordTokens = null; tokenIndex++; } 
                else { pendingWordTokens = { token: currentTok, remainingWords: words.slice(bestFit) }; break; }
              }
            }
            continue;
          }

          let pagePendingNotes = [];
          while ((tokenIndex < secTokens.length || pendingWordTokens) && remPageHeight > 50) {
            let peekTok = pendingWordTokens ? pendingWordTokens.token : secTokens[tokenIndex];
            if (peekTok && peekTok.type === 'h3' && document.getElementById('layout-h3').value === 'single-col') {
              const h3SpanBlock = document.createElement('div');
              h3SpanBlock.className = 'block-h3-span';
              h3SpanBlock.innerHTML = `<div class="h3-title-text" data-token-id="${peekTok.id}">${peekTok.text}</div>`;
              pageLayout.bodyFlow.appendChild(h3SpanBlock);
              headingPageMap[peekTok.id] = toGematria(pageIndex - 1);
              remPageHeight -= (h3SpanBlock.offsetHeight || 42);
              tokenIndex++;
              continue;
            }

            const block2Col = document.createElement('div');
            block2Col.className = 'block-2col';
            block2Col.innerHTML = `<div class="margin-notes-column right-margin"></div><div></div><div class="main-column right-col"></div><div></div><div class="main-column left-col"></div><div></div><div class="margin-notes-column left-margin"></div>`;
            pageLayout.bodyFlow.appendChild(block2Col);
            const rCol = block2Col.querySelector('.right-col');
            const lCol = block2Col.querySelector('.left-col');
            const rMargin = block2Col.querySelector('.right-margin');
            const lMargin = block2Col.querySelector('.left-margin');
            const actualColWidth = rCol.offsetWidth || 272;

            let subTokens = [];
            for (let i = tokenIndex; i < secTokens.length; i++) {
              if (secTokens[i].type === 'h3' && document.getElementById('layout-h3').value === 'single-col') break;
              subTokens.push(secTokens[i]);
            }

            const totalSubH = measureRemainingHeight(subTokens, 0, pendingWordTokens, actualColWidth);
            const isSubClosing = totalSubH <= (2 * remPageHeight);
            let targetBlockLimit = remPageHeight;
            if (isSubClosing) targetBlockLimit = Math.min(remPageHeight, Math.max(60, Math.ceil(totalSubH / 2) + 4));

            ['right', 'left'].forEach((colName) => {
              let targetCol = colName === 'right' ? rCol : lCol;
              let targetMargin = colName === 'right' ? rMargin : lMargin;
              let effectiveColLimit = targetBlockLimit;
              if (colName === 'left' && isSubClosing) effectiveColLimit = remPageHeight;

              while (tokenIndex < secTokens.length || pendingWordTokens) {
                let currentTok = pendingWordTokens ? pendingWordTokens.token : secTokens[tokenIndex];
                if (currentTok.type === 'h3' && document.getElementById('layout-h3').value === 'single-col') break;
                if (targetCol.scrollHeight >= effectiveColLimit - 10 && targetCol.children.length > 0) break;

                if (currentTok.type.startsWith('h')) {
                  const layout = document.getElementById(`layout-h${currentTok.level}`).value;
                  if (layout === 'new-page' && targetCol.children.length > 0) break;
                  
                  const hElem = document.createElement('div');
                  hElem.className = `title-level-${currentTok.level}`;
                  hElem.textContent = currentTok.text;
                  hElem.setAttribute('data-token-id', currentTok.id);
                  targetCol.appendChild(hElem);
                  if (!headingPageMap[currentTok.id]) headingPageMap[currentTok.id] = toGematria(pageIndex - 1);
                  if (targetCol.scrollHeight > effectiveColLimit - 45 && targetCol.children.length > 1) { targetCol.removeChild(hElem); break; }
                  tokenIndex++;
                  continue;
                }

                if (currentTok.type === 'p') {
                  let words = pendingWordTokens ? pendingWordTokens.remainingWords : currentTok.text.split(' ');
                  let isContinuation = pendingWordTokens ? true : false;
                  const pElem = document.createElement('p');
                  pElem.setAttribute('data-token-id', currentTok.id);
                  targetCol.appendChild(pElem);
                  if (currentTok.sideNote && !headingPageMap[currentTok.id]) headingPageMap[currentTok.id] = toGematria(pageIndex - 1);

                  let low = 1, high = words.length, bestFit = 0;
                  while (low <= high) {
                    let mid = Math.floor((low + high) / 2);
                    pElem.innerHTML = createDropWord(words.slice(0, mid).join(' '), isContinuation);
                    if (pElem.scrollHeight <= effectiveColLimit) { bestFit = mid; low = mid + 1; } else { high = mid - 1; }
                  }
                  if (bestFit === 0 && targetCol.children.length > 1) { targetCol.removeChild(pElem); break; }
                  if (bestFit === 0) bestFit = Math.min(8, words.length);
                  
                  while(bestFit > 1) {
                     pElem.innerHTML = createDropWord(words.slice(0, bestFit).join(' '), isContinuation);
                     const h1 = pElem.scrollHeight;
                     pElem.innerHTML = createDropWord(words.slice(0, bestFit - 1).join(' '), isContinuation);
                     const h2 = pElem.scrollHeight;
                     if(h1 === h2) bestFit--; else break;
                  }

                  const chunk = words.slice(0, bestFit).join(' ');
                  const isEndOfP = (bestFit >= words.length);
                  pElem.className = isEndOfP ? 'p-end' : 'p-cut';
                  pElem.innerHTML = createDropWord(chunk, isContinuation);
                  if (!isContinuation && currentTok.sideNote) {
                    const noteElem = document.createElement('div');
                    noteElem.className = 'side-note-anchor';
                    noteElem.textContent = currentTok.sideNote;
                    targetMargin.appendChild(noteElem);
                    pagePendingNotes.push({ elem: noteElem, pElem: pElem });
                  }
                  if (isEndOfP) { pendingWordTokens = null; tokenIndex++; } 
                  else { pendingWordTokens = { token: currentTok, remainingWords: words.slice(bestFit) }; break; }
                }
              }
            });

            const usedBlockH = Math.max(rCol.scrollHeight, lCol.scrollHeight);
            stretchColumn(rCol, usedBlockH);
            stretchColumn(lCol, usedBlockH);
            remPageHeight -= usedBlockH;

            if (tokenIndex >= secTokens.length && !pendingWordTokens) {
              const divHTML = getSectionDividerHTML(secDivStyle);
              if (divHTML) {
                const divContainer = document.createElement('div');
                divContainer.innerHTML = divHTML;
                pageLayout.bodyFlow.appendChild(divContainer.firstElementChild);
              }
              break;
            }
          }
          pagePendingNotes.forEach(item => { if (item.elem && item.pElem) item.elem.style.top = item.pElem.offsetTop + 'px'; });
        }
      }

      document.querySelectorAll('.toc-page-num[data-target-id], .l7-page[data-target-id]').forEach(span => {
        const targetId = span.getAttribute('data-target-id');
        if (targetId && headingPageMap[targetId]) span.textContent = headingPageMap[targetId];
      });
    }

    function buildStructuredTOC(tokenList, allowedLevels, groupedLevels) {
      const entries = [];
      let openGroups = [];
      tokenList.forEach(t => {
        if (t.type.startsWith('h') && allowedLevels.includes(t.level)) {
          while (openGroups.length > 0 && openGroups[openGroups.length-1] >= t.level) { entries.push({ type: 'groupEnd' }); openGroups.pop(); }
          if (groupedLevels.includes(t.level)) { entries.push({ type: 'groupStart', level: t.level }); openGroups.push(t.level); }
          entries.push({ type: 'item', id: t.id, level: t.level, text: t.text });
        } else if (t.type === 'p' && t.sideNote && allowedLevels.includes(7)) {
          while (openGroups.length > 0 && openGroups[openGroups.length-1] >= 7) { entries.push({ type: 'groupEnd' }); openGroups.pop(); }
          if (groupedLevels.includes(7)) { entries.push({ type: 'groupStart', level: 7 }); openGroups.push(7); }
          entries.push({ type: 'item', id: t.id, level: 7, text: t.sideNote, isH7: true });
        }
      });
      while (openGroups.length > 0) { entries.push({ type: 'groupEnd' }); openGroups.pop(); }
      return entries;
    }

    function renderPaginatedTOC(container, entries, titleText, headerRight, headerLeft, startPNum, headingPageMap, tocType) {
      if (entries.length === 0) return 0;
      const ITEMS_PAGE_1 = 20;
      const ITEMS_PAGE_REST = 28;
      let curIdx = 0;
      let pagesCount = 0;

      while (curIdx < entries.length) {
        const isFirstTOCPage = (pagesCount === 0);
        const limit = isFirstTOCPage ? ITEMS_PAGE_1 : ITEMS_PAGE_REST;
        let pageItems = entries.slice(curIdx, curIdx + limit);
        
        // Ensure we don't split a group across pages
        let lastValidIdx = pageItems.length - 1;
        while(lastValidIdx >= 0 && pageItems[lastValidIdx].type === 'groupEnd') {
           // Find matching groupStart
           let depth = 1;
           for(let i=lastValidIdx-1; i>=0; i--) {
             if(pageItems[i].type === 'groupEnd') depth++;
             if(pageItems[i].type === 'groupStart') depth--;
             if(depth === 0) {
               lastValidIdx = i - 1;
               break;
             }
           }
           break;
        }
        if(lastValidIdx < pageItems.length - 1 && lastValidIdx >= 0 && curIdx + lastValidIdx + 1 < entries.length) {
          pageItems = entries.slice(curIdx, curIdx + lastValidIdx + 1);
        }

        curIdx += pageItems.length;
        pagesCount++;
        const isLastPage = (curIdx >= entries.length);

        const page = document.createElement('div');
        page.className = 'a4-page toc-page';
        let itemsHTML = '';
        let inGroup = false;
        
        pageItems.forEach(it => {
          if (it.type === 'groupStart') { itemsHTML += `<div class="toc-group">`; inGroup = true; }
          else if (it.type === 'groupEnd') { itemsHTML += `</div>`; inGroup = false; }
          else if (it.type === 'item') {
            if (!headingPageMap[it.id]) return; // Skip if no page number
            const pageClass = inGroup ? 'toc-page-num toc-grouped-page' : 'toc-page-num';
            if (it.isH7) {
              itemsHTML += `<div class="toc-lvl-7-inline-block"><span class="l7-title">${it.text}</span> - <span class="l7-page ${pageClass}" data-target-id="${it.id}"></span></div>`;
            } else {
              itemsHTML += `<div class="toc-item toc-lvl-${it.level}"><span class="toc-title">${it.text}</span><span class="toc-dots"></span><span class="${pageClass}" data-target-id="${it.id}"></span></div>`;
            }
          }
        });

        const topHeader = `<div class="top-header-grid"><div class="header-right-col">${headerRight}</div><div class="header-center-ornament">${getTopOrnamentHTML(document.getElementById('top-content-center').value)}</div><div class="header-left-col">${headerLeft}</div></div>`;
        const mainTitleBlock = isFirstTOCPage ? `<div class="title-level-2-standalone" style="margin-top: 40px; margin-bottom: 25px;">${titleText}</div>` : '';
        const gridClass = isLastPage ? 'toc-grid-full toc-last-page' : 'toc-grid-full';

        page.innerHTML = `${topHeader}${mainTitleBlock}<div class="${gridClass}">${itemsHTML}</div><div class="page-number-footer">${toGematria(startPNum + pagesCount - 1)}</div>`;
        container.appendChild(page);
      }
      return pagesCount;
    }

    function createPageLayout(container, h2Text, h2TokenId, pNum, h1Title, h2Title) {
      const page = document.createElement('div');
      page.className = 'a4-page';
      const topCenterType = document.getElementById('top-content-center').value;
      const topOrnHTML = getTopOrnamentHTML(topCenterType);
      
      let rightContent = h1Title;
      const rightType = document.getElementById('top-content-right').value;
      if(rightType === 'book') rightContent = document.getElementById('inp-book-title').value;
      else if(rightType.startsWith('h')) rightContent = h1Title; // Simplified

      let leftContent = h2Title;
      const leftType = document.getElementById('top-content-left').value;
      if(leftType === 'book') leftContent = document.getElementById('inp-book-title').value;
      else if(leftType.startsWith('h')) leftContent = h2Title;

      page.innerHTML = `<div class="top-header-grid"><div class="header-right-col">${rightContent}</div><div class="header-center-ornament">${topOrnHTML}</div><div class="header-left-col">${leftContent}</div></div>${h2Text ? `<div class="title-level-2-standalone" ${h2TokenId !== undefined ? `data-token-id="${h2TokenId}"` : ''}>${h2Text}</div>` : ''}<div class="page-body-flow ${h2Text ? 'has-h2' : ''}"></div><div class="page-number-footer">${toGematria(pNum)}</div>`;
      container.appendChild(page);
      const bodyFlow = page.querySelector('.page-body-flow');
      const maxColHeight = h2Text ? 660 : 875;
      return { page, bodyFlow, maxColHeight };
    }

    function measureRemainingHeight(tokensList, startIndex, pending, colWidthPx) {
      const measureBox = document.getElementById('measuring-box');
      measureBox.style.width = colWidthPx + 'px';
      measureBox.innerHTML = '';
      let dummy = document.createElement('div');
      dummy.style.width = colWidthPx + 'px';
      if (pending) {
        let p = document.createElement('p');
        p.className = 'p-cut';
        p.innerHTML = createDropWord(pending.remainingWords.join(' '), true);
        dummy.appendChild(p);
      }
      for (let i = startIndex; i < tokensList.length; i++) {
        let tok = tokensList[i];
        if (tok.type.startsWith('h')) {
          let h = document.createElement('div');
          h.className = `title-level-${tok.level}`;
          h.textContent = tok.text;
          dummy.appendChild(h);
        } else if (tok.type === 'p') {
          let p = document.createElement('p');
          p.className = 'p-end';
          p.innerHTML = createDropWord(tok.text, false);
          dummy.appendChild(p);
        }
      }
      measureBox.appendChild(dummy);
      const h = dummy.offsetHeight;
      measureBox.innerHTML = '';
      return h;
    }

    function renderMainShaar(container, style) {
      const page = document.createElement('div');
      page.className = `a4-page main-shaar-page main-template-${style}`;
      const title = document.getElementById('inp-book-title').value || "ספר";
      const subtitle = document.getElementById('inp-book-subtitle').value || "";
      const desc = document.getElementById('inp-book-desc').value || "";
      const sections = document.getElementById('inp-book-sections').value || "";
      const author = document.getElementById('inp-book-author').value || "";
      const year = document.getElementById('inp-book-year').value || "";
      let frameHTML = '';
      if (style === '1') frameHTML = `<div class="m1-bg-top"></div><div class="m1-bg-middle"></div><div class="m1-bg-bottom"></div><div class="m1-panel"><div class="m1-damask right"></div><div style="flex-grow:1;"></div><div class="m1-damask left"></div></div>`;
      else if (style === '2') frameHTML = `<div class="m2-bg-top"></div><div class="m2-bg-middle"></div><div class="m2-bg-bottom"></div><div class="m2-panel"><div class="m2-lace right"></div><div style="flex-grow:1;"></div><div class="m2-lace left"></div></div>`;
      else if (style === '3') frameHTML = `<div class="m3-wavy-band"></div><div class="m3-panel"><svg class="m3-corner tr" viewBox="0 0 100 100"><path d="M90,10 L30,10 C15,10 10,25 25,35 C35,42 45,35 40,25 C36,18 25,20 22,16 C30,14 60,14 75,14 C78,30 78,60 76,78 C72,75 74,64 67,60 C57,55 50,65 57,75 C67,90 82,85 82,70 L82,10 Z"/></svg><svg class="m3-corner tl" viewBox="0 0 100 100"><path d="M90,10 L30,10 C15,10 10,25 25,35 C35,42 45,35 40,25 C36,18 25,20 22,16 C30,14 60,14 75,14 C78,30 78,60 76,78 C72,75 74,64 67,60 C57,55 50,65 57,75 C67,90 82,85 82,70 L82,10 Z"/></svg><svg class="m3-corner br" viewBox="0 0 100 100"><path d="M90,10 L30,10 C15,10 10,25 25,35 C35,42 45,35 40,25 C36,18 25,20 22,16 C30,14 60,14 75,14 C78,30 78,60 76,78 C72,75 74,64 67,60 C57,55 50,65 57,75 C67,90 82,85 82,70 L82,10 Z"/></svg><svg class="m3-corner bl" viewBox="0 0 100 100"><path d="M90,10 L30,10 C15,10 10,25 25,35 C35,42 45,35 40,25 C36,18 25,20 22,16 C30,14 60,14 75,14 C78,30 78,60 76,78 C72,75 74,64 67,60 C57,55 50,65 57,75 C67,90 82,85 82,70 L82,10 Z"/></svg></div>`;
      page.innerHTML = `${frameHTML}<div class="shaar-main-content"><div><div class="bsd-header">בס"ד</div><div class="sefer-label">ספר</div><div class="book-title-main">${title}</div><div class="book-subtitle">${subtitle}</div><svg style="width: 180px; height: 24px; margin: 12px auto;" viewBox="0 0 400 40"><circle cx="200" cy="20" r="10" fill="none" stroke="#000" stroke-width="4.5"/><circle cx="200" cy="20" r="4.5" fill="#000"/><path d="M182,20 C182,24 165,27 140,27 C90,27 40,22 5,20 C40,18 90,13 140,13 C165,13 182,16 182,20 Z" fill="#000"/><path d="M218,20 C218,24 235,27 260,27 C310,27 360,22 395,20 C360,18 310,13 260,13 C235,13 218,16 218,20 Z" fill="#000"/></svg></div><div class="book-description">${desc}</div><div class="book-sections-summary">${sections}</div><div class="author-block">חובר ונערך בס"ד ע"י<br><span class="author-name">${author}</span></div><div class="publication-footer">${year}</div></div>`;
      container.appendChild(page);
    }

    function renderSubShaar(container, token, style) {
      const page = document.createElement('div');
      page.className = 'a4-page sub-shaar-page';
      page.setAttribute('data-token-id', token.id);
      let titleMain = token.text;
      let titleSub = '';
      if (token.text.includes('-') || token.text.includes('–') || token.text.includes('—')) {
        const parts = token.text.split(/[-–—]/);
        titleMain = parts[0].trim();
        titleSub = parts.slice(1).join(' - ').trim();
      }
      let innerLace = '';
      if (style === '2') innerLace = '<div class="m2-lace" style="border-left: 1px solid #ddd;"></div>';
      page.innerHTML = `<div class="sub-shaar-bg-right"></div><div class="sub-shaar-col"><div class="sub-shaar-content-centered" style="flex-grow: 1;"><div class="sefer-label">חלק</div><div class="book-title-main" style="font-size: 36pt;">${titleMain}</div>${titleSub ? `<svg style="width: 140px; height: 25px; margin: 15px auto;" viewBox="0 0 300 30"><path d="M10,15 Q75,5 140,15 Q145,10 150,5 Q155,10 160,15 Q225,5 290,15 Q225,25 160,15 Q155,20 150,25 Q145,20 140,15 Q75,25 10,15 Z" fill="#222"/></svg><div class="book-subtitle" style="font-size: 21pt;">${titleSub}</div>` : ''}</div>${innerLace}</div>`;
      container.appendChild(page);
    }

    window.onload = initAll;
  </script>
</body>
