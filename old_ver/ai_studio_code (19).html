  .top-header-grid { display: grid; grid-template-columns: var(--w-margin) var(--w-gap) var(--w-col) var(--w-gutter) var(--w-col) var(--w-gap) var(--w-margin); align-items: center; height: 24px; flex-shrink: 0; width: 100%; margin-bottom: auto;}

  }

  .block-2col { display: grid; grid-template-columns: var(--w-margin) var(--w-gap) var(--w-col) var(--w-gutter) var(--w-col) var(--w-gap) var(--w-margin); width: 100%; align-items: start; justify-content: start; position: relative;}

  }

  <script>
    /* שליטת Sidebar חלון כלי סטאטית */
    const resizer = document.getElementById('resizer');
    const sidebar = document.getElementById('sidebar');
    let isResizing = false;

    resizer.addEventListener('mousedown', () => { isResizing = true; document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; });
    window.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const w = document.body.clientWidth - e.clientX;
      if (w >= 360 && w <= 780) sidebar.style.width = w + 'px';
    });
    window.addEventListener('mouseup', () => { isResizing = false; document.body.style.cursor = ''; document.body.style.userSelect = ''; });

    /* Utility Gematria */
    function toGematria(num) {
      if (!num || isNaN(num) || num <= 0) return "";
      if (num === 15) return "טו"; if (num === 16) return "טז";
      const hundreds = ["", "ק", "ר", "ש", "ת", "תק", "תר", "תש", "תת", "תתק"];
      const tens = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
      const ones = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
      let str = "";
      let h = Math.floor(num / 100);
      if (h > 0) {
        if (h <= 4) str += ["", "ק", "ר", "ש", "ת"][h];
        else if (h < hundreds.length) str += hundreds[h];
        num %= 100;
      }
      let t = Math.floor(num / 10);
      let o = num % 10;
      if (t === 1 && (o === 5 || o === 6)) { str += (o === 5) ? "טו" : "טז"; } else { str += tens[t] + ones[o]; }
      return str;
    }

    function syncRootProps() {
      const rt = document.documentElement.style;
      rt.setProperty('--w-col', document.getElementById('prop-col').value + '%');
      rt.setProperty('--w-margin', document.getElementById('prop-margin').value + '%');
      rt.setProperty('--w-gutter', document.getElementById('prop-gutter').value + '%');
      rt.setProperty('--w-gap', document.getElementById('prop-gap').value + '%');
      
      const sizesToMap = [
        {el: 'f-body', map: '--fn-body'}, {el: 'size-body', map: '--sz-body', app:'pt'},
        {el: 'font-first-word', map: '--fn-first-word'}, {el: 'size-first-word', map: '--sz-first-word', app:'em'},
        {el: 'f-h0', map:'--fn-h0'}, {el: 's-h0', map:'--sz-h0', app:'pt'},
        {el: 'f-h1', map:'--fn-h1'}, {el: 's-h1', map:'--sz-h1', app:'pt'},
        {el: 'f-h2', map:'--fn-h2'}, {el: 's-h2', map:'--sz-h2', app:'pt'},
        {el: 'f-h3', map:'--fn-h3'}, {el: 's-h3', map:'--sz-h3', app:'pt'},
        {el: 'f-h4', map:'--fn-h4'}, {el: 's-h4', map:'--sz-h4', app:'pt'},
        {el: 'f-h5', map:'--fn-h5'}, {el: 's-h5', map:'--sz-h5', app:'pt'},
        {el: 'f-h6', map:'--fn-h6'}, {el: 's-h6', map:'--sz-h6', app:'pt'},
        {el: 'f-h7', map:'--fn-h7'}, {el: 's-h7', map:'--sz-h7', app:'pt'},
        {el: 'f-hdr-r', map:'--fn-header-r'}, {el: 's-hdr-r', map:'--sz-header-r', app:'pt'},
        {el: 'f-hdr-c', map:'--fn-header-c'}, {el: 's-hdr-c', map:'--sz-header-c', app:'pt'},
        {el: 'f-hdr-l', map:'--fn-header-l'}, {el: 's-hdr-l', map:'--sz-header-l', app:'pt'},
      ];

      sizesToMap.forEach(i => {
         const vl = document.getElementById(i.el === 'f-body' ? 'font-body' : i.el);
         if(vl) rt.setProperty(i.map, vl.value + (i.app ? i.app : ''));
      });
    }

    let parsedHeaderContext = {};

    function gatherTextDataAndHeaders() {
      let t = document.getElementById('raw-input').value;
      
      const config = {title:'ספר', sub:'', desc:'', sections:'', auth:'', year:''};
      let raw = t.split('\n');
      const cleantok = [];
      raw.forEach(line => {
        let text = line.trim();
        let pass = true;
        if (/^שם הספר[-–—:]*(.*)$/i.test(text)) { config.title = text.split(/[-–—:]/)[1].trim(); pass=false;}
        else if (/^נושא[-–—:]*(.*)$/i.test(text)) { config.sub = text.split(/[-–—:]/)[1].trim(); pass=false;}
        else if (/^נושא מפורט[-–—:]*(.*)$/i.test(text)) { config.desc = text.split(/[-–—:]/)[1].trim(); pass=false;}
        else if (/^פרטי[-–—:]*(.*)$/i.test(text)) { config.sections = text.split(/[-–—:]/)[1].trim(); pass=false;}

    function splitElementInLineBalanceExactDom(pgObjectLeft, pgObjectRight) {
         const Lc = pgObjectLeft.node; // HTML NODE div main col Left
         const Rc = pgObjectRight.node; 

         // מנגנון חוק יישור תחתית מושך 2 פסודו - אמת וציות : 1. החזר את הDOM הקל.
         let diff = Rc.scrollHeight - Lc.scrollHeight;
         if(Math.abs(diff) < 2) return; 

         if (diff > 0) {
             // ימין גבוה - שוטח! נעביר פסקאות
             let chld = Array.from(Rc.children);
             while(chld.length > 0) {
                 let curN = chld[chld.length-1];
                 
                 if (curN.tagName==='DIV') break; // אל תחתוך החוצה Headers בסוף פרק רגע מטור ימין, למרות שמסדר אמיתי כן יעביר

                 Lc.insertBefore(curN, Lc.firstChild); 
                 let newD = Rc.scrollHeight - Lc.scrollHeight;

                 if (newD < 0) {
                     // חרוג: הלייבל הפיזי שמאל ארוך עכשיו יותר, זה שובר הלכות כתיבה ספר. מחזירים, שופכים שורות בודדות..
                     Rc.appendChild(curN);
                     executePixelPreciseWordPullRightToLeft(Rc, Lc, curN); 
                     break; 
                 }
                 if(newD <= 2) break;
                 chld.pop();
             }
         }
         
         // 2. Diff סופי אם קצר בודד:
         let fnlDf = Rc.scrollHeight - Lc.scrollHeight;
         let lnSpacePixels = measureSubNodeCache? parseFloat(measureSubNodeCache.lineHeight)*0.8 : 10;
         
         if (fnlDf > 0 && fnlDf <= lnSpacePixels * 2.1) { 
             let lsH = Lc.querySelectorAll('p');
             if(lsH.length>0) {
                 let aInc = Math.min(5, (fnlDf / lsH.length)); // הזרק padding עדין
                 Array.from(lsH).forEach(hN=> hN.style.paddingBottom = aInc+'px');
             }
         } else if (fnlDf < 0 && Math.abs(fnlDf) <= lnSpacePixels*2.1) {
             // לפעמים זרם חיתוך גזר מילית נוסף קו
             let rxH = Rc.querySelectorAll('p');
             if(rxH.length>0) {
                 let aInc = Math.min(5, (Math.abs(fnlDf) / rxH.length));
                 Array.from(rxH).forEach(hN=> hN.style.paddingBottom = aInc+'px');
             }
         }
    }

    function executePixelPreciseWordPullRightToLeft(nodeRight, nodeLeft, tarPRightDom) {
        if (!tarPRightDom || tarPRightDom.tagName !== 'P') return; 

        // הופך Pright להיות Cut , והשמאלי שיפער קל Ends 
        let rawWs = Array.from(tarPRightDom.childNodes).map(n=>{
            if (n.className==='first-word-window') return n.outerHTML; // Keep strong payload pure HTML!
            if (n.nodeType === 3) return n.textContent; return ''; 
        }).join('').split(/\s+/).filter(d=>d);
        
        // יצירת סמי פרגט בשמאל : חוק מילה 1 לא תקף אליו כהעתק .
        let newSubPLeft = document.createElement('p');
        newSubPLeft.className = 'p-end';
        nodeLeft.insertBefore(newSubPLeft, nodeLeft.firstChild);

        tarPRightDom.className = 'p-cut';
        
        let p_startW = rawWs;
        let p_moveW = [];
        
        for (let ix=rawWs.length-1; ix>2; ix--) { // מגבלה לא להעביר כל הקומפיונרט ולהישאר יתום ריק! ה1 ימין יישאר תמיד למעלה 2 מילים (drop+1) 
             p_moveW.unshift(p_startW.pop()); 
             
             tarPRightDom.innerHTML = p_startW.join(' ');
             newSubPLeft.innerHTML = p_moveW.join(' ');

             if (nodeLeft.scrollHeight >= nodeRight.scrollHeight) {
                 // גלישה שמאלית עלתה פיזית על קו. משחזר פעימה! (אחת החזיר מילה חזרה למקום ופייפד מעדנן.)
                 p_startW.push(p_moveW.shift());
                 tarPRightDom.innerHTML = p_startW.join(' ');
                 newSubPLeft.innerHTML = p_moveW.join(' ');
                 break; 
             }
        }

        // במקרה שLeft ריק בפעולות עדיף למחוק 
        if(p_moveW.length === 0) nodeLeft.removeChild(newSubPLeft);
        
        // פילוח אחרון והצהרה של קונטקס First word windows -> "תמיכה במילה יתומה למטה שמאלית"
        if(tarPRightDom.innerHTML === '' ) nodeRight.removeChild(tarPRightDom);

        cleanWindowArtifactIfTiny(tarPRightDom); 
    }

    /* Saving Options Panel Setup HTML Downloader Native Template Generator - DO NOT TOUCH RAW TEXT DOM REPLACE EXCLUSIONS RULE !!! */ 
    function saveAsDefaultTemplate() {
      document.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => input.setAttribute('value', input.value));
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => { if (cb.checked) cb.setAttribute('checked', 'checked'); else cb.removeAttribute('checked'); });
      document.querySelectorAll('select').forEach(sel => Array.from(sel.options).forEach(opt => { if (opt.value === sel.value) opt.setAttribute('selected', 'selected'); else opt.removeAttribute('selected'); }));
      const rN = document.getElementById('raw-input'); const pVx = rN.value; rN.innerHTML = ''; rN.value = '';
      const fxHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML; rN.value = pVx;
      const ablo = new Blob([fxHtml], { type: 'text/html;charset=utf-8' });
      const dxA = document.createElement('a'); dxA.href = URL.createObjectURL(ablo); dxA.download = 'torani-template-pro-export.html'; dxA.click(); URL.revokeObjectURL(dxA.href);
    }
