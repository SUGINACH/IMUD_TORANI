<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת עימוד תורנית מקצועית לדפי A4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bellefair&family=David+Libre:wght@400;700&family=Frank+Ruhl+Libre:wght@400;700;900&family=Noto+Serif+Hebrew:wght@400;700;900&family=Assistant:wght@400;600;700&display=swap');

  :root {
    /* גופנים וגדלים */
    --fn-header: 'AAd_Livorna4', 'David Libre', 'David', serif;
    --sz-header: 13pt;

    --fn-h1: 'Lia Sgula', 'Bellefair', serif;
    --sz-h1: 50pt;

    --fn-h1-sub: 'David Libre', 'David', serif;
    --sz-h1-sub: 28pt;

    --fn-h2: 'AAd_AlphaBlack', 'David Libre', 'David', serif;
    --sz-h2: 17pt;

    --fn-h3: 'AAd_AlphaLight', 'Noto Serif Hebrew', serif;
    --sz-h3: 13.5pt;

    --fn-h4: 'FrankRuehl', 'Frank Ruhl Libre', serif;
    --sz-h4: 12.5pt;

    --fn-h5: 'David Libre', 'David', serif;
    --sz-h5: 11.5pt;

    --fn-h6: 'Noto Serif Hebrew', serif;
    --sz-h6: 10.5pt;

    --fn-h7: 'Hadassah Friedlaender', 'Hadassah', 'Noto Serif Hebrew', serif;
    --sz-h7: 6pt;

    --fn-body: 'Rashi DP', 'Frank Ruhl Libre', serif;
    --sz-body: 11.2pt;

    --fn-first-word: 'Rashi DP', 'Frank Ruhl Libre', serif;
    --sz-first-word: 1.5em;

    /* גריד */
    --w-margin: 7.5%;
    --w-gap: 2%;
    --w-col: 40%;
    --w-gutter: 2%;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    background-color: #5a5a5a;
    font-family: var(--fn-body);
    color: #000000;
    display: flex;
    flex-direction: row;
  }

  /* -------------------------------------------------------------
     סרגל שליטה ימני עם גרירה
  ------------------------------------------------------------- */
  #sidebar {
    width: 520px;
    min-width: 360px;
    max-width: 750px;
    height: 100vh;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    padding: 12px 14px;
    box-shadow: -3px 0 15px rgba(0,0,0,0.3);
    z-index: 100;
    font-family: 'David Libre', serif;
    overflow-y: auto;
    flex-shrink: 0;
  }

  #resizer {
    width: 6px;
    height: 100vh;
    background: #333333;
    cursor: col-resize;
    flex-shrink: 0;
    z-index: 110;
    transition: background 0.2s;
  }
  #resizer:hover, #resizer.resizing {
    background: #b8860b;
  }

  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .sidebar-title { font-size: 13pt; font-weight: 700; }

  .btn-load-fonts {
    background-color: #2c3e50;
    color: #fff;
    border: none;
    padding: 4px 8px;
    font-size: 8.5pt;
    font-weight: 700;
    cursor: pointer;
    border-radius: 3px;
  }

  .accordion-box {
    background: #fbfbfb;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin-bottom: 6px;
    overflow: hidden;
  }

  .accordion-title {
    background: #eaeaea;
    padding: 5px 10px;
    font-size: 9.5pt;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
  }

  .accordion-body {
    padding: 8px 10px;
    font-size: 9pt;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 5px;
  }
  .form-group label { font-weight: 700; margin-bottom: 2px; font-size: 8.5pt; }
  .form-group input, .form-group select {
    padding: 3px 6px;
    border: 1px solid #aaa;
    border-radius: 3px;
    font-family: inherit;
    font-size: 9pt;
  }

  .toc-levels-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    background: #f0f0f0;
    padding: 4px 6px;
    border-radius: 3px;
    margin-top: 3px;
    margin-bottom: 4px;
  }
  .toc-levels-row label {
    font-size: 8pt;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 2px;
    cursor: pointer;
  }

  .proportions-grid, .styles-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px 8px;
    font-size: 8.5pt;
  }

  .prop-item, .style-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .style-item label { font-weight: 700; width: 80px; }
  .style-item select { padding: 2px; font-size: 8pt; width: 95px; }
  .style-item input { width: 36px; padding: 2px; text-align: center; font-size: 8pt; }

  .textarea-container {
    display: flex;
    flex-direction: column;
    min-height: 120px;
    height: 140px;
    margin-bottom: 8px;
  }

  #raw-input {
    width: 100%;
    height: 100%;
    font-family: monospace;
    font-size: 9.5pt;
    padding: 6px;
    border: 1px solid #777;
    border-radius: 3px;
    direction: rtl;
    resize: none;
  }

  /* לחצני הפעולה בתחתית הסרגל */
  .btn-bar-bottom {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1.5px solid #ccc;
    flex-shrink: 0;
  }
  .btn-primary {
    background-color: #000;
    color: #fff;
    border: none;
    padding: 8px 12px;
    font-size: 10pt;
    font-weight: 700;
    cursor: pointer;
    border-radius: 3px;
    flex-grow: 1;
  }
  .btn-save-template {
    background-color: #1e3a8a;
    color: #fff;
    border: none;
    padding: 8px 10px;
    font-size: 9.5pt;
    font-weight: 700;
    cursor: pointer;
    border-radius: 3px;
  }
  .btn-secondary {
    background-color: #f0f0f0;
    color: #000;
    border: 1px solid #666;
    padding: 8px 10px;
    font-size: 9.5pt;
    cursor: pointer;
    border-radius: 3px;
  }

  /* -------------------------------------------------------------
     תצוגת דפים מעומדים משמאל
  ------------------------------------------------------------- */
  #preview-pane {
    flex-grow: 1;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 25px 20px;
    scroll-behavior: smooth;
    background-color: #5a5a5a;
  }

  .a4-page {
    background-color: #ffffff;
    width: 210mm;
    height: 297mm;
    max-height: 297mm;
    padding: 15mm 15mm 15mm 15mm;
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
    position: relative;
    margin-bottom: 30px;
    page-break-after: always;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* -------------------------------------------------------------
     שער ראשי ושערי משנה
  ------------------------------------------------------------- */
  .main-shaar-page {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 0;
  }

  .shaar-main-content {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    padding: 20mm 12mm 16mm 12mm;
    z-index: 20;
    position: relative;
  }

  .bsd-header { font-family: 'David Libre', serif; font-size: 11pt; font-weight: 700; color: #444; }
  .sefer-label { font-family: 'David Libre', serif; font-size: 15pt; letter-spacing: 5px; font-weight: 700; margin-top: 4px; }
  .book-title-main { font-family: var(--fn-h1); font-size: var(--sz-h1); line-height: 1.1; margin: 10px 0 4px 0; }
  .book-subtitle { font-family: var(--fn-h1-sub); font-size: var(--sz-h1-sub); font-weight: 700; line-height: 1.25; }
  
  .book-description {
    font-family: var(--fn-body);
    font-size: 12pt;
    line-height: 1.5;
    max-width: 65%;
    margin: 10px auto;
  }

  .book-sections-summary { font-family: 'David Libre', serif; font-size: 11.5pt; line-height: 1.5; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; padding: 6px 12px; margin: 8px 0; font-weight: 700; }
  .author-block { font-family: 'David Libre', serif; font-size: 13pt; line-height: 1.3; }
  .author-name { font-size: 15pt; font-weight: 700; }
  .publication-footer { font-family: 'David Libre', serif; font-size: 12pt; font-weight: 700; letter-spacing: 1px; }

  /* תבניות שער ראשי */
  .m1-bg-top { position: absolute; top: 0; left: 0; right: 0; height: 20%; background: linear-gradient(135deg, #f2f2f2 0%, #e2e2e2 100%); border-bottom: 1px solid #d0d0d0; }
  .m1-bg-middle { position: absolute; top: 20%; left: 0; right: 0; height: 60%; background: #ffffff; }
  .m1-bg-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 20%; background: linear-gradient(135deg, #f2f2f2 0%, #e2e2e2 100%); border-top: 1px solid #d0d0d0; }
  .m1-panel { position: absolute; top: 0; bottom: 0; left: 12%; right: 12%; background: #ffffff; border-right: 1px solid #ccc; border-left: 1px solid #ccc; box-shadow: 0 0 20px rgba(0,0,0,0.1); display: flex; justify-content: space-between; z-index: 10; }
  .m1-damask { width: 30px; height: 100%; background: #fafafa url("data:image/svg+xml,%3Csvg width='32' height='55' viewBox='0 0 32 55' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M16,27 C10,22 5,14 5,5 C5,0 10,0 16,5 C22,0 27,0 27,5 C27,14 22,22 16,27 Z M16,27 C10,32 5,40 5,49 C5,55 10,55 16,49 C22,55 27,55 27,49 C27,40 22,32 16,27 Z M16,14 A3.5,3.5 0 1,0 16,21 A3.5,3.5 0 1,0 16,14 Z' fill='%239e9e9e' fill-opacity='0.35'/%3E%3C/svg%3E") repeat-y; flex-shrink: 0; }
  
  .m2-bg-top { position: absolute; top: 0; left: 0; right: 0; height: 18%; background: #eaeaea; }
  .m2-bg-middle { position: absolute; top: 18%; left: 0; right: 0; height: 64%; background: #ffffff; box-shadow: inset 0 2px 6px rgba(0,0,0,0.06), inset 0 -2px 6px rgba(0,0,0,0.06); }
  .m2-bg-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 18%; background: #eaeaea; }
  .m2-panel { position: absolute; top: 0; bottom: 0; left: 10%; right: 10%; background: #ffffff; box-shadow: 0 0 25px rgba(0,0,0,0.12); display: flex; justify-content: space-between; z-index: 10; }
  .m2-lace { width: 24px; height: 100%; background: #ffffff url("data:image/svg+xml,%3Csvg width='26' height='40' viewBox='0 0 26 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M13,20 C4,16 2,8 2,2 C2,0 8,0 13,8 C18,0 24,0 24,2 C24,8 22,16 13,20 Z M13,20 C4,24 2,32 2,38 C2,40 8,40 13,32 C18,40 24,40 24,38 C24,32 22,24 13,20 Z M13,10 A3,3 0 1,0 13,16 A3,3 0 1,0 13,10 Z M13,30 A3,3 0 1,0 13,24 A3,3 0 1,0 13,30 Z' fill='%23888888' fill-opacity='0.45'/%3E%3C/svg%3E") repeat-y; flex-shrink: 0; }

  .m3-wavy-band { position: absolute; top: 14%; left: 0; right: 0; height: 72%; background: #ffffff; border-top: 1.5px solid #d4d4d4; border-bottom: 1.5px solid #d4d4d4; }
  .m3-panel { position: absolute; top: 0; bottom: 0; left: 9%; right: 9%; background: #ffffff; border-right: 1.5px solid #ccc; border-left: 1.5px solid #ccc; box-shadow: 0 0 25px rgba(0,0,0,0.14); z-index: 10; }
  .m3-corner { position: absolute; width: 65px; height: 65px; fill: #111; z-index: 25; }
  .m3-corner.tr { top: 10mm; right: 10mm; }
  .m3-corner.tl { top: 10mm; left: 10mm; transform: scaleX(-1); }
  .m3-corner.br { bottom: 10mm; right: 10mm; transform: scaleY(-1); }
  .m3-corner.bl { bottom: 10mm; left: 10mm; transform: scale(-1, -1); }

  /* -------------------------------------------------------------
     שערי משנה: טור מוצב בצד שמאל וממורכז אנכית
  ------------------------------------------------------------- */
  .sub-shaar-page { position: relative; padding: 0; }
  .sub-shaar-col {
    position: absolute;
    top: 0; bottom: 0;
    left: 0;
    right: auto;
    width: 55%;
    background: #ffffff;
    border-right: 1.5px solid #ccc;
    box-shadow: 5px 0 18px rgba(0,0,0,0.08);
    display: flex;
    z-index: 10;
  }
  .sub-shaar-bg-right {
    position: absolute;
    top: 0; bottom: 0;
    right: 0; left: 55%;
    background: #f4f4f4;
  }
  .sub-shaar-content-centered {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20mm 12mm;
  }

  /* -------------------------------------------------------------
     תוכן עניינים
  ------------------------------------------------------------- */
  .toc-page {
    padding: 15mm 15mm 15mm 15mm;
    display: flex;
    flex-direction: column;
  }
  .toc-grid-full {
    display: flex;
    flex-direction: column;
    gap: 0;
    width: 100%;
    max-width: 175mm;
    margin: 0 auto 42px auto;
    flex: 1 1 auto;
    min-height: 0;
    justify-content: space-between;
  }
  .toc-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 3px;
    font-family: 'David Libre', serif;
    font-size: 10.5pt;
    break-inside: avoid;
  }
  .toc-title {
    flex-shrink: 1;
    max-width: 84%;
    font-weight: 600;
    white-space: normal;
    word-wrap: break-word;
    overflow-wrap: break-word;
    text-align: right;
    line-height: 1.3;
  }
  .toc-dots {
    flex-grow: 1;
    border-bottom: 1px dotted #777;
    margin: 0 8px;
    height: 1px;
    min-width: 25px;
  }
  .toc-page-num {
    flex-shrink: 0;
    font-weight: 700;
    font-family: 'David Libre', serif;
    font-size: 10.5pt;
    min-width: 25px;
    text-align: left;
  }
  
  .toc-lvl-1 { font-size: 12pt; font-weight: 700; margin-top: 10px; margin-bottom: 4px; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
  .toc-lvl-2 { font-size: 11pt; font-weight: 700; margin-top: 6px; padding-right: 8px; }
  .toc-lvl-3 { font-size: 10.5pt; font-weight: 700; padding-right: 16px; }
  .toc-lvl-4 { padding-right: 24px; }
  .toc-lvl-5 { padding-right: 32px; }
  .toc-lvl-6 { padding-right: 40px; }

  .toc-lvl-7-inline-block {
    padding-right: 48px;
    font-size: 8.8pt;
    color: #333;
    line-height: 1.45;
    margin: 2px 0 6px 0;
    text-align: justify;
    font-family: 'David Libre', serif;
  }
  .toc-lvl-7-inline-block .l7-title { font-weight: 600; color: #222; }
  .toc-lvl-7-inline-block .l7-page { font-weight: 700; color: #000; }
  .toc-lvl-7-inline-block .l7-sep { color: #888; margin: 0 5px; font-weight: bold; }

  /* -------------------------------------------------------------
     זרימת העמוד (בלוקים דינמיים לחיתוך כותרת 3)
  ------------------------------------------------------------- */
  .top-header-grid {
    display: grid;
    grid-template-columns: var(--w-margin) var(--w-gap) var(--w-col) var(--w-gutter) var(--w-col) var(--w-gap) var(--w-margin);
    align-items: center;
    margin-bottom: 24px;
    font-family: var(--fn-header);
    height: 24px;
    flex-shrink: 0;
  }

  .header-right-col {
    grid-column: 3;
    text-align: center;
    font-size: var(--sz-header);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-center-ornament {
    grid-column: 4;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    width: 100%;
    overflow: visible;
  }

  .header-left-col {
    grid-column: 5;
    text-align: center;
    font-size: var(--sz-header);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .title-level-2-standalone {
    font-family: var(--fn-h2);
    font-size: var(--sz-h2);
    font-weight: 700;
    text-align: center;
    margin-top: 110px;
    margin-bottom: 40px;
    width: 100%;
    line-height: 1.25;
    flex-shrink: 0;
  }

  /* קונטיינר זרימה אנכי לכל הדף */
  .page-body-flow {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-height: 875px;
    max-height: 875px;
    position: relative;
  }
  .page-body-flow.has-h2 {
    min-height: 660px;
    max-height: 660px;
  }

  /* בלוק שני טורים */
  .block-2col {
    display: grid;
    grid-template-columns: var(--w-margin) var(--w-gap) var(--w-col) var(--w-gutter) var(--w-col) var(--w-gap) var(--w-margin);
    width: 100%;
    position: relative;
    align-items: start;
  }

  /* בלוק כותרת 3 - חיתוך ופריסה מלאה מעל הטורים */
  .block-h3-span {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 10px 0 6px 0;
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  .block-h3-span .h3-title-text {
    font-family: var(--fn-h3);
    font-size: var(--sz-h3);
    font-weight: 900;
    text-align: center;
    width: 100%;
    line-height: 1.22;
  }

  /* כותרות 4–6 */
  .title-level-4 { font-family: var(--fn-h4); font-size: var(--sz-h4); font-weight: 900; text-align: center; margin: 9px 0 4px 0; line-height: 1.22; }
  .title-level-5 { font-family: var(--fn-h5); font-size: var(--sz-h5); font-weight: 700; text-align: center; margin: 7px 0 3px 0; line-height: 1.22; }
  .title-level-6 { font-family: var(--fn-h6); font-size: var(--sz-h6); font-weight: 700; text-align: center; margin: 6px 0 3px 0; line-height: 1.22; }

  /* בלוק טור יחיד עבור כותרת 0 */
  .block-single-col {
    display: grid;
    grid-template-columns: var(--w-margin) var(--w-gap) calc(var(--w-col)*2 + var(--w-gutter)) var(--w-gap) var(--w-margin);
    width: 100%;
    position: relative;
    align-items: start;
  }
  .block-single-col .single-wide-col {
    grid-column: 3;
    font-family: var(--fn-body);
    font-size: var(--sz-body);
    line-height: 1.45;
    text-align: justify;
    text-justify: inter-word;
  }

  .margin-notes-column {
    font-family: var(--fn-h7);
    font-size: var(--sz-h7);
    line-height: 1.18;
    text-align: center;
    text-align-last: center;
    font-weight: 400;
    color: #404040;
    position: relative;
    width: 100%;
    height: 100%;
  }

  .right-margin { grid-column: 1; }
  .left-margin { grid-column: 7; }

  .side-note-anchor { position: absolute; width: 100%; }

  .main-column {
    font-family: var(--fn-body);
    font-size: var(--sz-body);
    line-height: 1.34;
    text-align: justify;
    text-justify: inter-word;
    min-height: 0;
    height: auto;
    position: relative;
  }

  .right-col { grid-column: 3; }
  .left-col { grid-column: 5; }

  p { margin-bottom: 7px; text-align: justify; text-justify: inter-word; position: relative; }
  p.p-end { text-align-last: center; }
  p.p-cut { text-align-last: justify; }

  .first-word-window {
    float: right;
    font-family: var(--fn-first-word);
    font-size: var(--sz-first-word);
    font-weight: 900;
    line-height: 0.85;
    height: 1.25em;
    margin-left: 6px;
    margin-bottom: 1px;
    display: block;
  }

  .page-number-footer {
    position: absolute;
    bottom: 14mm;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--fn-header);
    font-size: 12pt;
    font-weight: 700;
    height: 20px;
  }

  #measuring-box {
    position: absolute;
    visibility: hidden;
    pointer-events: none;
    top: -9999px;
    left: -9999px;
    font-family: var(--fn-body);
    font-size: var(--sz-body);
    line-height: 1.34;
  }

  @media print {
    body { background: none; padding: 0; overflow: visible; display: block; }
    #sidebar, #resizer { display: none !important; }
    #preview-pane { height: auto !important; overflow: visible !important; padding: 0 !important; background: none !important; }
    .a4-page {
      box-shadow: none;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      max-height: 100vh;
      padding: 15mm 15mm 15mm 15mm;
      margin: 0;
      page-break-after: always;
    }
  }
</style>
</head>
<body>

  <!-- ==================== 1. סרגל שליטה ימני ==================== -->

  <script>
    function toggleBox(id) {
      const el = document.getElementById(id);
      if (el) {
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }
    }

    function toggleCustomTopInput() {
      const sel = document.getElementById('top-ornament-style');
      const group = document.getElementById('custom-top-orn-group');
      if (sel && group) {
        group.style.display = (sel.value === 'custom') ? 'flex' : 'none';
      }
    }

    // -------------------------------------------------------------
    // מנגנון גרירת רוחב הסרגל (Resizable Splitter)
    // -------------------------------------------------------------
    const resizer = document.getElementById('resizer');
    const sidebar = document.getElementById('sidebar');
    let isResizing = false;

    resizer.addEventListener('mousedown', () => {
      isResizing = true;
      resizer.classList.add('resizing');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const newWidth = document.body.clientWidth - e.clientX;
      if (newWidth >= 360 && newWidth <= 750) {
        sidebar.style.width = newWidth + 'px';
      }
    });

    window.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('resizing');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    // -------------------------------------------------------------
    // שמירת תבנית מותאמת כברירת מחדל
    // -------------------------------------------------------------
    function saveAsDefaultTemplate() {
      // עדכון ערכי ה-DOM כדי שיישמרו כ-HTML
      document.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => {
        input.setAttribute('value', input.value);
      });
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        if (cb.checked) cb.setAttribute('checked', 'checked');
        else cb.removeAttribute('checked');
      });
      document.querySelectorAll('select').forEach(sel => {
        Array.from(sel.options).forEach(opt => {
          if (opt.value === sel.value) opt.setAttribute('selected', 'selected');
          else opt.removeAttribute('selected');
        });
      });

      // ניקוי תיבת הטקסט בקובץ הנשמר
      const rawInputElem = document.getElementById('raw-input');
      const prevVal = rawInputElem.value;
      rawInputElem.innerHTML = '';
      rawInputElem.value = '';

      const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

      // שחזור ה-textarea החי
      rawInputElem.value = prevVal;

      const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'torani-typesetting-template.html';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function loadSystemFonts() {
      if ('queryLocalFonts' in window) {
        try {
          const availableFonts = await window.queryLocalFonts();
          const fontFamilies = [...new Set(availableFonts.map(f => f.family))].sort((a, b) => a.localeCompare(b, 'he'));
          
          if (fontFamilies.length > 0) {
            document.querySelectorAll('.font-picker').forEach(select => {
              const currentVal = select.value;
              select.innerHTML = '';
              
              const sysGroup = document.createElement('optgroup');
              sysGroup.label = `גופני מחשב (${fontFamilies.length} נמצאו)`;
              
              fontFamilies.forEach(family => {
                const opt = document.createElement('option');
                opt.value = `'${family}', serif`;
                opt.textContent = family;
                if (currentVal.includes(family)) opt.selected = true;
                sysGroup.appendChild(opt);
              });
              
              select.appendChild(sysGroup);
            });
            alert(`נטענו בהצלחה ${fontFamilies.length} גופנים מותקנים מהמחשב!`);
          }
        } catch (err) {
          alert('לא ניתנה הרשאה לגישה לגופני המחשב.');
        }
      } else {
        alert('הדפדפן הנוכחי אינו תומך בגישה ישירה לגופני המערכת. מומלץ להשתמש ב-Chrome או Edge.');
      }
    }

    function toGematria(num) {
      num = parseInt(num, 10);
      if (isNaN(num) || num <= 0) return "";
      if (num === 15) return "טו";
      if (num === 16) return "טז";
      const hundreds = ["", "ק", "ר", "ש", "ת", "תק", "תר", "תש", "תת", "תתק"];
      const tens = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
      const ones = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
      let str = "";
      let h = Math.floor(num / 100);
      if (h > 0) {
        if (h <= 4) str += ["", "ק", "ר", "ש", "ת"][h];
        else if (h < hundreds.length) str += hundreds[h];
        num %= 100;
      }
      let t = Math.floor(num / 10);
      let o = num % 10;
      if (t === 1 && (o === 5 || o === 6)) {
        str += (o === 5) ? "טו" : "טז";
      } else {
        str += tens[t] + ones[o];
      }
      return str;
    }

    function updateGrid() {
      const root = document.documentElement;
      root.style.setProperty('--w-col', document.getElementById('prop-col').value + '%');
      root.style.setProperty('--w-margin', document.getElementById('prop-margin').value + '%');
      root.style.setProperty('--w-gutter', document.getElementById('prop-gutter').value + '%');
      root.style.setProperty('--w-gap', document.getElementById('prop-gap').value + '%');
    }

    function updateStyles() {
      const root = document.documentElement;
      root.style.setProperty('--fn-header', document.getElementById('font-header').value);
      root.style.setProperty('--sz-header', document.getElementById('size-header').value + 'pt');

      root.style.setProperty('--fn-h1', document.getElementById('font-h1').value);
      root.style.setProperty('--sz-h1', document.getElementById('size-h1').value + 'pt');

      root.style.setProperty('--fn-h1-sub', document.getElementById('font-h1-sub').value);
      root.style.setProperty('--sz-h1-sub', document.getElementById('size-h1-sub').value + 'pt');

      root.style.setProperty('--fn-h2', document.getElementById('font-h2').value);
      root.style.setProperty('--sz-h2', document.getElementById('size-h2').value + 'pt');

      root.style.setProperty('--fn-h3', document.getElementById('font-h3').value);
      root.style.setProperty('--sz-h3', document.getElementById('size-h3').value + 'pt');

      root.style.setProperty('--fn-h4', document.getElementById('font-h4').value);
      root.style.setProperty('--sz-h4', document.getElementById('size-h4').value + 'pt');

      root.style.setProperty('--fn-h5', document.getElementById('font-h5').value);
      root.style.setProperty('--sz-h5', document.getElementById('size-h5').value + 'pt');

      root.style.setProperty('--fn-h6', document.getElementById('font-h6').value);
      root.style.setProperty('--sz-h6', document.getElementById('size-h6').value + 'pt');

      root.style.setProperty('--fn-h7', document.getElementById('font-h7').value);
      root.style.setProperty('--sz-h7', document.getElementById('size-h7').value + 'pt');

      root.style.setProperty('--fn-first-word', document.getElementById('font-first-word').value);
      root.style.setProperty('--sz-first-word', document.getElementById('size-first-word').value + 'em');

      root.style.setProperty('--fn-body', document.getElementById('font-body').value);
      root.style.setProperty('--sz-body', document.getElementById('size-body').value + 'pt');
    }

    function createDropWord(text, isContinuation) {
      if (isContinuation) return text;
      text = text.trim();
      const firstSpace = text.indexOf(' ');
      if (firstSpace === -1) {
        return `<span class="first-word-window">${text}</span>`;
      }
      const firstWord = text.substring(0, firstSpace);
      const rest = text.substring(firstSpace + 1);
      return `<span class="first-word-window">${firstWord}</span> ${rest}`;
    }

    // -------------------------------------------------------------
    // איזון קומבינטורי אמיתי לשני טורים.
    // במקום לבחור חיתוך לפי הטור הראשון ואז למתוח מרווחים,
    // נמדדים מועמדים אמיתיים של חיתוך (כולל חיתוך באמצע פסקה)
    // ונבחרת החלוקה שממזערת קודם את הגובה המרבי ואחר כך את הפער.
    // -------------------------------------------------------------
    function buildBalanceSources(tokensList, pending) {
      const sources = [];
      if (pending) {
        sources.push({
          kind: pending.token.type,
          token: pending.token,
          words: pending.remainingWords.slice(),
          isContinuation: true,
          isPending: true
        });
      }

      tokensList.forEach(token => {
        if (token.type === 'p') {
          sources.push({
            kind: 'p',
            token,
            words: token.text.split(' '),
            isContinuation: false,
            isPending: false
          });
        } else if (token.type.startsWith('h')) {
          sources.push({
            kind: token.type,
            token,
            words: null,
            isContinuation: false,
            isPending: false
          });
        }
      });
      return sources;
    }

    function balanceCutIsFull(source, wordCount) {
      return source.kind.startsWith('h') || wordCount >= source.words.length;
    }

    function appendBalanceSourcePart(col, source, startWord, endWord, isContinuation, onPage, pageMap, pageGematria) {
      if (source.kind.startsWith('h')) {
        if (endWord <= startWord) return null;
        const hElem = document.createElement('div');
        hElem.className = `title-level-${source.token.level}`;
        hElem.textContent = source.token.text;
        hElem.setAttribute('data-token-id', source.token.id);
        col.appendChild(hElem);
        if (onPage && pageMap && pageGematria && !pageMap[source.token.id]) {
          pageMap[source.token.id] = pageGematria;
        }
        return hElem;
      }

      if (endWord <= startWord) return null;
      const words = source.words.slice(startWord, endWord);
      const pElem = document.createElement('p');
      pElem.setAttribute('data-token-id', source.token.id);
      const isEnd = endWord >= source.words.length;
      pElem.className = isEnd ? 'p-end' : 'p-cut';
      pElem.innerHTML = createDropWord(words.join(' '), isContinuation);
      col.appendChild(pElem);

      if (onPage && !isContinuation && source.token.sideNote) {
        return { pElem, sideNote: source.token.sideNote };
      }
      return pElem;
    }

    function renderBalanceRange(col, sources, startSource, startWord, endSource, endWord, firstContinuation, marginCol, pagePendingNotes, pageMap, pageGematria) {
      for (let i = startSource; i <= endSource; i++) {
        const source = sources[i];
        const sWord = (i === startSource && source.kind === 'p') ? startWord : 0;
        const eWord = (i === endSource && source.kind === 'p') ? endWord : (source.kind === 'p' ? source.words.length : 1);
        const continuation = (i === startSource) ? firstContinuation : false;
        const result = appendBalanceSourcePart(col, source, sWord, eWord, continuation, true, pageMap, pageGematria);
        if (result && result.sideNote && marginCol) {
          const noteElem = document.createElement('div');
          noteElem.className = 'side-note-anchor';
          noteElem.textContent = result.sideNote;
          marginCol.appendChild(noteElem);
          if (pagePendingNotes) pagePendingNotes.push({ elem: noteElem, pElem: result.pElem });
        }
      }
    }

    function measureBalanceCut(sources, cut, colWidthPx) {
      const measureBox = document.getElementById('measuring-box');
      measureBox.innerHTML = '';
      measureBox.style.display = 'block';
      measureBox.style.width = (colWidthPx * 2 + 24) + 'px';

      const left = document.createElement('div');
      const right = document.createElement('div');
      left.className = 'main-column';
      right.className = 'main-column';
      left.style.width = colWidthPx + 'px';
      right.style.width = colWidthPx + 'px';
      left.style.display = 'inline-block';
      right.style.display = 'inline-block';
      left.style.verticalAlign = 'top';
      right.style.verticalAlign = 'top';

      if (cut.sourceIndex >= 0) {
        for (let i = 0; i < cut.sourceIndex; i++) {
          const source = sources[i];
          appendBalanceSourcePart(left, source, 0, source.kind === 'p' ? source.words.length : 1, source.isContinuation, false);
        }
        const leftSource = sources[cut.sourceIndex];
        if (leftSource.kind.startsWith('h')) {
          appendBalanceSourcePart(left, leftSource, 0, 1, leftSource.isContinuation, false);
        } else if (cut.wordCount > 0) {
          appendBalanceSourcePart(left, leftSource, 0, cut.wordCount, leftSource.isContinuation, false);
        }
      }

      const cutSource = sources[cut.sourceIndex];
      if (cutSource && cut.wordCount < (cutSource.kind === 'p' ? cutSource.words.length : 1) && cutSource.kind === 'p') {
        appendBalanceSourcePart(right, cutSource, cut.wordCount, cutSource.words.length, true, false);
      }
      for (let i = cut.sourceIndex + 1; i < sources.length; i++) {
        const source = sources[i];
        appendBalanceSourcePart(right, source, 0, source.kind === 'p' ? source.words.length : 1, source.isContinuation, false);
      }

      measureBox.appendChild(left);
      measureBox.appendChild(right);
      const leftH = left.offsetHeight;
      const rightH = right.offsetHeight;
      measureBox.innerHTML = '';
      return { leftH, rightH, maxH: Math.max(leftH, rightH), diff: Math.abs(leftH - rightH) };
    }

    function getFullCutForSource(sourceIndex, sources) {
      const source = sources[sourceIndex];
      return { sourceIndex, wordCount: source.kind === 'p' ? source.words.length : 1 };
    }

    function findBestBalancedSplit(sources, colWidthPx) {
      if (!sources.length) return null;

      const scoreCache = new Map();
      const getScore = (cut) => {
        const key = cut.sourceIndex + ':' + cut.wordCount;
        if (!scoreCache.has(key)) {
          scoreCache.set(key, measureBalanceCut(sources, cut, colWidthPx));
        }
        return scoreCache.get(key);
      };

      // אומדן חד-מעברי של גובה כל מקור. זה משמש רק כדי לאתר את אזור
      // החיתוך; ההחלטה הסופית נעשית תמיד במדידה מדויקת של שני הטורים.
      const measureBox = document.getElementById('measuring-box');
      measureBox.innerHTML = '';
      measureBox.style.display = 'block';
      measureBox.style.width = colWidthPx + 'px';

      // חשוב: אין לקרוא scrollHeight של אותו probe אחרי כל append.
      // קריאה כזו מכריחה את הדפדפן לבצע reflow מלא בכל איטרציה והופכת
      // מסמך ארוך ל-O(n²). כל מקור נמדד בבידוד, פעם אחת בלבד.
      const sourceHeights = sources.map(source => {
        const probe = document.createElement('div');
        probe.className = 'main-column';
        probe.style.width = colWidthPx + 'px';
        appendBalanceSourcePart(
          probe, source, 0,
          source.kind === 'p' ? source.words.length : 1,
          source.isContinuation, false
        );
        measureBox.appendChild(probe);
        const h = Math.max(1, probe.offsetHeight);
        probe.remove();
        return h;
      });
      measureBox.innerHTML = '';

      const totalApproxH = sourceHeights.reduce((a, b) => a + b, 0);
      const target = totalApproxH / 2;
      let cumulative = 0;
      let bestIndex = 0;
      let bestDistance = Infinity;
      sourceHeights.forEach((h, i) => {
        cumulative += h;
        const d = Math.abs(cumulative - target);
        if (d < bestDistance) {
          bestDistance = d;
          bestIndex = i;
        }
      });

      const candidates = [];
      const seen = new Set();
      const addCandidate = (cut) => {
        if (!cut || cut.sourceIndex < 0 || cut.sourceIndex >= sources.length) return;
        const source = sources[cut.sourceIndex];
        const maxWords = source.kind === 'p' ? source.words.length : 1;
        if (cut.wordCount < 1 || cut.wordCount > maxWords) return;
        const key = cut.sourceIndex + ':' + cut.wordCount;
        if (!seen.has(key)) {
          seen.add(key);
          candidates.push(cut);
        }
      };

      // גבולות טוקנים סמוכים לנקודת האיזון.
      for (let i = Math.max(0, bestIndex - 3); i <= Math.min(sources.length - 1, bestIndex + 3); i++) {
        addCandidate(getFullCutForSource(i, sources));
      }

      // חיפוש מדויק יותר בתוך פסקאות סמוכות: קודם חיפוש בינארי של מספר
      // המילים שמביא את שני הטורים לקרבת גובה, ואחר כך סריקה מקומית.
      for (let i = Math.max(0, bestIndex - 1); i <= Math.min(sources.length - 1, bestIndex + 1); i++) {
        const source = sources[i];
        if (source.kind !== 'p' || source.words.length <= 1) continue;

        let lo = 1;
        let hi = source.words.length;
        let center = Math.floor(source.words.length / 2);
        while (lo <= hi) {
          const mid = Math.floor((lo + hi) / 2);
          const score = getScore({ sourceIndex: i, wordCount: mid });
          center = mid;
          if (score.leftH < score.rightH) lo = mid + 1;
          else hi = mid - 1;
        }
        center = Math.max(1, Math.min(source.words.length, center));
        for (let w = Math.max(1, center - 6); w <= Math.min(source.words.length, center + 6); w++) {
          addCandidate({ sourceIndex: i, wordCount: w });
        }
      }

      // כאשר המסמך קצר במיוחד, נבדקים כל גבולות הטוקנים; במסמך ארוך
      // האזור המקומי סביב נקודת האיזון מספיק לאחר האומדן החד-מעברי.
      if (sources.length <= 40) {
        for (let i = 0; i < sources.length; i++) {
          addCandidate(getFullCutForSource(i, sources));
        }
      }

      let best = null;
      candidates.forEach(cut => {
        const score = getScore(cut);
        if (!best || score.maxH < best.score.maxH - 0.01 ||
            (Math.abs(score.maxH - best.score.maxH) <= 0.01 && score.diff < best.score.diff)) {
          best = { cut, score };
        }
      });
      return best;
    }

    // גיבוי ההתנהגות הקיימת עבור בלוקים שאינם בלוקי סיום מאוזנים.
    function justifyColumnVertically(col, maxH) {
      const children = Array.from(col.children);
      if (children.length <= 1) return;
      const currentH = col.scrollHeight;
      const diff = maxH - currentH;
      if (diff > 2 && diff < 160) {
        const extraPerItem = diff / (children.length - 1);
        children.slice(0, -1).forEach(child => {
          const curMB = parseFloat(getComputedStyle(child).marginBottom) || 0;
          child.style.marginBottom = (curMB + extraPerItem) + 'px';
        });
      }
    }

    function applyBalanceCut(cut, sources, originalTokenIndex, originalPending) {
      const pendingOffset = originalPending ? 1 : 0;
      const source = sources[cut.sourceIndex];
      const consumedFull = balanceCutIsFull(source, cut.wordCount);

      if (source.kind === 'p' && !consumedFull) {
        return {
          tokenIndex: originalTokenIndex + Math.max(0, cut.sourceIndex - pendingOffset),
          pendingWordTokens: { token: source.token, remainingWords: source.words.slice(cut.wordCount) }
        };
      }

      return {
        tokenIndex: originalTokenIndex + Math.max(0, cut.sourceIndex - pendingOffset + 1),
        pendingWordTokens: null
      };
    }

    let lineToTokenMap = [];

    // -------------------------------------------------------------
    // שאיבת פרטי ספר מראש הטקסט
    // -------------------------------------------------------------
    function parseMetadataFromText(rawText) {
      const lines = rawText.split('\n');
      const cleanLines = [];

      for (let line of lines) {
        const trimmed = line.trim();
        let match = false;

        if (/^(?:שם הספר[:\s]*)?שם הספר\s*[-–—:]\s*(.*)$/i.test(trimmed)) {
          document.getElementById('inp-book-title').value = trimmed.replace(/^(?:שם הספר[:\s]*)?שם הספר\s*[-–—:]\s*/i, '').trim();
          match = true;
        } else if (/^(?:נושא(?:\\|\/)כותרת משנה[:\s]*)?נושא\s*[-–—:]\s*(.*)$/i.test(trimmed)) {
          document.getElementById('inp-book-subtitle').value = trimmed.replace(/^(?:נושא(?:\\|\/)כותרת משנה[:\s]*)?נושא\s*[-–—:]\s*/i, '').trim();
          match = true;
        } else if (/^(?:נושא מפורט\s*(?:\\|\/)\s*תיאור[:\s]*)?נושא מפורט\s*[-–—:]\s*(.*)$/i.test(trimmed)) {
          document.getElementById('inp-book-desc').value = trimmed.replace(/^(?:נושא מפורט\s*(?:\\|\/)\s*תיאור[:\s]*)?נושא מפורט\s*[-–—:]\s*/i, '').trim();
          match = true;
        } else if (/^(?:פרטי מהדורא\s*(?:\\|\/)\s*חלקים[:\s]*)?פרטי מהדורא\s*[-–—:]\s*(.*)$/i.test(trimmed)) {
          document.getElementById('inp-book-sections').value = trimmed.replace(/^(?:פרטי מהדורא\s*(?:\\|\/)\s*חלקים[:\s]*)?פרטי מהדורא\s*[-–—:]\s*/i, '').trim();
          match = true;
        } else if (/^(?:שם המחבר[:\s]*)?שם המחבר\s*[-–—:]\s*(.*)$/i.test(trimmed)) {
          document.getElementById('inp-book-author').value = trimmed.replace(/^(?:שם המחבר[:\s]*)?שם המחבר\s*[-–—:]\s*/i, '').trim();
          match = true;
        } else if (/^(?:מקום ושנת הוצאה[:\s]*)?מקום ושנת הוצאה\s*[-–—:]\s*(.*)$/i.test(trimmed)) {
          document.getElementById('inp-book-year').value = trimmed.replace(/^(?:מקום ושנת הוצאה[:\s]*)?מקום ושנת הוצאה\s*[-–—:]\s*/i, '').trim();
          match = true;
        }

        if (!match) {
          cleanLines.push(line);
        }
      }
      return cleanLines.join('\n');
    }

    // -------------------------------------------------------------
    // מנוע עימוד ראשי
    // -------------------------------------------------------------
    function typesetDocument() {
      updateGrid();
      updateStyles();

      let rawText = document.getElementById('raw-input').value;
      if (!rawText.trim()) return;

      rawText = parseMetadataFromText(rawText);

      const container = document.getElementById('book-container');
      container.innerHTML = '';

      const lines = rawText.split('\n');
      const tokens = [];
      let pendingSideNote = null;
      lineToTokenMap = [];

      for (let lineIdx = 0; lineIdx < lines.length; lineIdx++) {
        const line = lines[lineIdx].trim();
        if (!line) {
          lineToTokenMap[lineIdx] = null;
          continue;
        }

        const hMatch = line.match(/^כותרת\s*(\d+)\s*(?:מספר\s*\d+)?\s*[-–—]\s*(.*)$/);
        if (hMatch) {
          const lvl = parseInt(hMatch[1], 10);
          const txt = hMatch[2].trim();
          if (lvl === 7) {
            pendingSideNote = txt;
            lineToTokenMap[lineIdx] = null;
          } else {
            const tokenObj = { id: tokens.length, type: 'h' + lvl, level: lvl, text: txt, lineIdx: lineIdx };
            tokens.push(tokenObj);
            lineToTokenMap[lineIdx] = tokenObj.id;
          }
        } else {
          const tokenObj = { id: tokens.length, type: 'p', text: line, sideNote: pendingSideNote, lineIdx: lineIdx };
          tokens.push(tokenObj);
          lineToTokenMap[lineIdx] = tokenObj.id;
          pendingSideNote = null;
        }
      }

      // חלוקה למקטעים
      const sections = [];
      let currentSection = { type: 'body', tokens: [] };

      tokens.forEach(t => {
        if (t.type === 'h1') {
          if (currentSection.tokens.length > 0) sections.push(currentSection);
          sections.push({ type: 'h1', token: t, tokens: [] });
          currentSection = { type: 'body', tokens: [] };
        } else if (t.type === 'h2' || t.type === 'h0') {
          if (currentSection.tokens.length > 0) sections.push(currentSection);
          currentSection = { type: t.type, h2Token: t, tokens: [] };
        } else {
          currentSection.tokens.push(t);
        }
      });
      if (currentSection.tokens.length > 0 || currentSection.type === 'h2' || currentSection.type === 'h0') {
        sections.push(currentSection);
      }

      const gtocLevels = Array.from(document.querySelectorAll('.gtoc-lvl:checked')).map(cb => parseInt(cb.value, 10));
      const dtocLevels = Array.from(document.querySelectorAll('.dtoc-lvl:checked')).map(cb => parseInt(cb.value, 10));

      const headingPageMap = {};
      let pageIndex = 1;
      let currentH1Title = '';
      let currentH2Title = '';

      const bookTitle = document.getElementById('inp-book-title').value || "ספר";
      const showMainShaar = document.getElementById('show-main-shaar').checked;
      const mainShaarStyle = document.getElementById('main-shaar-style').value;
      const subShaarStyle = document.getElementById('sub-shaar-style').value;
      const topOrnStyle = document.getElementById('top-ornament-style').value;
      const secDivStyle = document.getElementById('section-divider-style').value;
      const enableGeneralTOC = document.getElementById('enable-general-toc').checked;
      const enableDetailedTOC = document.getElementById('enable-detailed-toc').checked;

      // 1. שער ראשי
      if (showMainShaar) {
        renderMainShaar(container, mainShaarStyle);
      }

      // 2. תוכן עניינים כללי
      if (enableGeneralTOC) {
        const generalTocEntries = buildStructuredTOC(tokens, gtocLevels);
        const pagesRendered = renderPaginatedTOC(
          container, 
          generalTocEntries, 
          "תוכן עניינים כללי", 
          bookTitle, 
          "תוכן עניינים כללי", 
          pageIndex, 
          topOrnStyle
        );
        pageIndex += pagesRendered;
      }

      // 3. עיבוד מקטעים וסוגיות
      for (let sIdx = 0; sIdx < sections.length; sIdx++) {
        const sec = sections[sIdx];

        if (sec.type === 'h1') {
          renderSubShaar(container, sec.token, subShaarStyle);
          currentH1Title = sec.token.text.split(/[-–—]/)[0].trim();
          headingPageMap[sec.token.id] = toGematria(pageIndex);

          if (enableDetailedTOC) {
            let inThisH1 = false;
            const thisH1Tokens = [];

            for (let t of tokens) {
              if (t.id === sec.token.id) { inThisH1 = true; continue; }
              if (inThisH1 && t.type === 'h1') break;
              if (inThisH1) thisH1Tokens.push(t);
            }

            const detailedTocEntries = buildStructuredTOC(thisH1Tokens, dtocLevels);
            const dtocPages = renderPaginatedTOC(
              container, 
              detailedTocEntries, 
              "תוכן עניינים מפורט", 
              currentH1Title, 
              "תוכן עניינים מפורט", 
              pageIndex, 
              topOrnStyle
            );
            pageIndex += dtocPages;
          }
          continue;
        }

        const isH0 = (sec.type === 'h0');
        let isFirstPage = true;
        let h2Text = (sec.type === 'h2' || sec.type === 'h0') ? sec.h2Token.text : '';
        let h2Id = (sec.type === 'h2' || sec.type === 'h0') ? sec.h2Token.id : undefined;
        if (h2Text) {
          currentH2Title = h2Text;
          headingPageMap[h2Id] = toGematria(pageIndex);
        }

        let secTokens = sec.tokens.slice();
        let tokenIndex = 0;
        let pendingWordTokens = null;

        while (tokenIndex < secTokens.length || pendingWordTokens) {
          let pageLayout = createPageLayout(
            container, 
            isFirstPage ? h2Text : '', 
            isFirstPage ? h2Id : undefined, 
            pageIndex, 
            currentH1Title, 
            currentH2Title, 
            topOrnStyle
          );
          pageIndex++;
          isFirstPage = false;

          let remPageHeight = pageLayout.maxColHeight;

          // מצב טור יחיד עבור כותרת 0 (הקדמה)
          if (isH0) {
            const singleBlock = document.createElement('div');
            singleBlock.className = 'block-single-col';
            singleBlock.innerHTML = `<div class="single-wide-col"></div>`;
            pageLayout.bodyFlow.appendChild(singleBlock);
            const targetCol = singleBlock.querySelector('.single-wide-col');

            while (tokenIndex < secTokens.length || pendingWordTokens) {
              if (targetCol.scrollHeight >= remPageHeight - 10 && targetCol.children.length > 0) {
                break;
              }

              let currentTok = pendingWordTokens ? pendingWordTokens.token : secTokens[tokenIndex];

              if (currentTok.type.startsWith('h')) {
                const hElem = document.createElement('div');
                hElem.className = `title-level-${currentTok.level}`;
                hElem.textContent = currentTok.text;
                hElem.setAttribute('data-token-id', currentTok.id);
                targetCol.appendChild(hElem);
                headingPageMap[currentTok.id] = toGematria(pageIndex - 1);
                tokenIndex++;
                continue;
              }

              if (currentTok.type === 'p') {
                let words = pendingWordTokens ? pendingWordTokens.remainingWords : currentTok.text.split(' ');
                let isContinuation = pendingWordTokens ? true : false;

                const pElem = document.createElement('p');
                pElem.setAttribute('data-token-id', currentTok.id);
                targetCol.appendChild(pElem);

                let low = 1, high = words.length, bestFit = 0;
                while (low <= high) {
                  let mid = Math.floor((low + high) / 2);
                  let testSlice = words.slice(0, mid).join(' ');
                  pElem.className = (mid >= words.length) ? 'p-end' : 'p-cut';
                  pElem.innerHTML = createDropWord(testSlice, isContinuation);

                  if (targetCol.scrollHeight <= remPageHeight) {
                    bestFit = mid;
                    low = mid + 1;
                  } else {
                    high = mid - 1;
                  }
                }

                if (bestFit === 0 && targetCol.children.length > 1) {
                  targetCol.removeChild(pElem);
                  break;
                }
                if (bestFit === 0) bestFit = Math.min(10, words.length);

                const chunk = words.slice(0, bestFit).join(' ');
                const isEndOfP = (bestFit >= words.length);
                pElem.className = isEndOfP ? 'p-end' : 'p-cut';
                pElem.innerHTML = createDropWord(chunk, isContinuation);

                if (isEndOfP) {
                  pendingWordTokens = null;
                  tokenIndex++;
                } else {
                  pendingWordTokens = { token: currentTok, remainingWords: words.slice(bestFit) };
                  break;
                }
              }
            }
            continue;
          }

          // -------------------------------------------------------------
          // חיתוך דינמי של כותרת 3 וניהול טורים מאוזנים
          // -------------------------------------------------------------
          let pagePendingNotes = [];

          while ((tokenIndex < secTokens.length || pendingWordTokens) && remPageHeight > 50) {
            
            // בדיקה אם הטוקן הנוכחי הוא כותרת 3
            let peekTok = pendingWordTokens ? pendingWordTokens.token : secTokens[tokenIndex];
            if (peekTok && peekTok.type === 'h3') {
              const h3SpanBlock = document.createElement('div');
              h3SpanBlock.className = 'block-h3-span';
              h3SpanBlock.innerHTML = `<div class="h3-title-text" data-token-id="${peekTok.id}">${peekTok.text}</div>`;
              pageLayout.bodyFlow.appendChild(h3SpanBlock);
              
              headingPageMap[peekTok.id] = toGematria(pageIndex - 1);
              remPageHeight -= (h3SpanBlock.offsetHeight || 42);
              tokenIndex++;
              continue;
            }

            // יצירת בלוק 2 טורים מתחת/מעל כותרת 3
            const block2Col = document.createElement('div');
            block2Col.className = 'block-2col';
            block2Col.innerHTML = `
              <div class="margin-notes-column right-margin"></div>
              <div></div>
              <div class="main-column right-col"></div>
              <div></div>
              <div class="main-column left-col"></div>
              <div></div>
              <div class="margin-notes-column left-margin"></div>
            `;
            pageLayout.bodyFlow.appendChild(block2Col);

            const rCol = block2Col.querySelector('.right-col');
            const lCol = block2Col.querySelector('.left-col');
            const rMargin = block2Col.querySelector('.right-margin');
            const lMargin = block2Col.querySelector('.left-margin');
            const actualColWidth = rCol.offsetWidth || 272;

            // חישוב גובה עד לכותרת 3 הבאה או סוף מקטע
            let subTokens = [];
            // pendingWordTokens כבר מייצג את תחילת הטוקן הנוכחי; אין להוסיף
            // את הטוקן המקורי פעם נוספת, אחרת החיפוש ימדוד אותו פעמיים.
            const subStartIndex = pendingWordTokens ? tokenIndex + 1 : tokenIndex;
            for (let i = subStartIndex; i < secTokens.length; i++) {
              if (secTokens[i].type === 'h3') break;
              subTokens.push(secTokens[i]);
            }

            const totalSubH = measureRemainingHeight(subTokens, 0, pendingWordTokens, actualColWidth);
            const isSubClosing = totalSubH <= (2 * remPageHeight);

            // כאשר כל תת-הפרק נכנס בשני הטורים, לא משתמשים בחלוקה
            // שרירותית של totalSubH/2. מתבצע חיפוש קומבינטורי של
            // נקודת חיתוך ממשית, כולל חיתוך באמצע פסקה, ונבחרת
            // החלוקה הקצרה והשווה ביותר.
            if (isSubClosing) {
              const balanceSources = buildBalanceSources(subTokens, pendingWordTokens);
              const bestBalance = findBestBalancedSplit(balanceSources, actualColWidth);

              const dividerProbe = document.createElement('div');
              const dividerHTMLProbe = getSectionDividerHTML(secDivStyle);
              let dividerH = 0;
              if (dividerHTMLProbe) {
                dividerProbe.innerHTML = dividerHTMLProbe;
                dividerProbe.style.position = 'absolute';
                dividerProbe.style.visibility = 'hidden';
                dividerProbe.style.width = '100%';
                pageLayout.bodyFlow.appendChild(dividerProbe);
                dividerH = dividerProbe.firstElementChild ? dividerProbe.firstElementChild.offsetHeight : dividerProbe.offsetHeight;
                dividerProbe.remove();
              }

              if (bestBalance && bestBalance.score.maxH <= Math.max(40, remPageHeight - dividerH - 2)) {
                const rightSource = balanceSources[bestBalance.cut.sourceIndex];

                // הבלוק עצמו כבר קיים ב-DOM; ממלאים אותו לפי נקודת החיתוך שנבחרה.
                if (bestBalance.cut.sourceIndex > 0) {
                  renderBalanceRange(
                    rCol, balanceSources, 0, 0,
                    bestBalance.cut.sourceIndex - 1,
                    balanceSources[bestBalance.cut.sourceIndex - 1].kind === 'p' ? balanceSources[bestBalance.cut.sourceIndex - 1].words.length : 1,
                    balanceSources[0].isContinuation, rMargin, pagePendingNotes, headingPageMap, toGematria(pageIndex - 1)
                  );
                }
                if (rightSource.kind === 'p' && bestBalance.cut.wordCount < rightSource.words.length) {
                  renderBalanceRange(
                    rCol, balanceSources, bestBalance.cut.sourceIndex, 0,
                    bestBalance.cut.sourceIndex, bestBalance.cut.wordCount,
                    rightSource.isContinuation, rMargin, pagePendingNotes, headingPageMap, toGematria(pageIndex - 1)
                  );
                } else {
                  renderBalanceRange(
                    rCol, balanceSources, bestBalance.cut.sourceIndex, 0,
                    bestBalance.cut.sourceIndex,
                    rightSource.kind === 'p' ? rightSource.words.length : 1,
                    rightSource.isContinuation, rMargin, pagePendingNotes, headingPageMap, toGematria(pageIndex - 1)
                  );
                }

                const rightFirstContinuation = (rightSource.kind === 'p' && bestBalance.cut.wordCount < rightSource.words.length) ? true : false;
                if (rightSource.kind === 'p' && bestBalance.cut.wordCount < rightSource.words.length) {
                  const pElem = lCol.appendChild(document.createElement('p'));
                  pElem.setAttribute('data-token-id', rightSource.token.id);
                  pElem.className = 'p-end';
                  pElem.innerHTML = createDropWord(rightSource.words.slice(bestBalance.cut.wordCount).join(' '), true);
                }

                for (let i = bestBalance.cut.sourceIndex + 1; i < balanceSources.length; i++) {
                  const source = balanceSources[i];
                  const result = appendBalanceSourcePart(
                    lCol, source, 0, source.kind === 'p' ? source.words.length : 1,
                    (i === bestBalance.cut.sourceIndex + 1 ? rightFirstContinuation : source.isContinuation), true
                  );
                  if (result && result.sideNote && lMargin) {
                    const noteElem = document.createElement('div');
                    noteElem.className = 'side-note-anchor';
                    noteElem.textContent = result.sideNote;
                    lMargin.appendChild(noteElem);
                    pagePendingNotes.push({ elem: noteElem, pElem: result.pElem });
                  }
                }

                const prevTokenIndex = tokenIndex;
                const prevPendingRemaining = pendingWordTokens ? pendingWordTokens.remainingWords.length : -1;
                const nextState = applyBalanceCut(bestBalance.cut, balanceSources, tokenIndex, pendingWordTokens);
                tokenIndex = nextState.tokenIndex;
                pendingWordTokens = nextState.pendingWordTokens;

                // הגנה קשיחה מפני לולאה ללא התקדמות, במיוחד סביב חיתוך באמצע
                // טוקן pending. במקרה כזה נופלים מיד למסלול העימוד הרגיל.
                const nextPendingRemaining = pendingWordTokens ? pendingWordTokens.remainingWords.length : -1;
                if (tokenIndex === prevTokenIndex && nextPendingRemaining === prevPendingRemaining) {
                  rCol.innerHTML = '';
                  lCol.innerHTML = '';
                  rMargin.innerHTML = '';
                  lMargin.innerHTML = '';
                  break;
                }

                const usedBlockH = Math.max(rCol.scrollHeight, lCol.scrollHeight);
                remPageHeight -= usedBlockH;

                if (tokenIndex >= secTokens.length && !pendingWordTokens) {
                  const divHTML = getSectionDividerHTML(secDivStyle);
                  if (divHTML) {
                    const divContainer = document.createElement('div');
                    divContainer.innerHTML = divHTML;
                    pageLayout.bodyFlow.appendChild(divContainer.firstElementChild);
                  }
                  break;
                }
                continue;
              }
            }

            let targetBlockLimit = remPageHeight;

            ['right', 'left'].forEach((colName) => {
              let targetCol = colName === 'right' ? rCol : lCol;
              let targetMargin = colName === 'right' ? rMargin : lMargin;
              let effectiveColLimit = targetBlockLimit;

              if (colName === 'left' && isSubClosing) {
                effectiveColLimit = remPageHeight;
              }

              while (tokenIndex < secTokens.length || pendingWordTokens) {
                let currentTok = pendingWordTokens ? pendingWordTokens.token : secTokens[tokenIndex];

                // עצירה אם הגענו לכותרת 3 הבאה
                if (currentTok.type === 'h3') {
                  break;
                }

                if (targetCol.scrollHeight >= effectiveColLimit - 10 && targetCol.children.length > 0) {
                  break;
                }

                // כותרות 4–6
                if (currentTok.type.startsWith('h')) {
                  const hElem = document.createElement('div');
                  hElem.className = `title-level-${currentTok.level}`;
                  hElem.textContent = currentTok.text;
                  hElem.setAttribute('data-token-id', currentTok.id);
                  targetCol.appendChild(hElem);

                  if (!headingPageMap[currentTok.id]) {
                    headingPageMap[currentTok.id] = toGematria(pageIndex - 1);
                  }

                  if (targetCol.scrollHeight > effectiveColLimit - 45 && targetCol.children.length > 1) {
                    targetCol.removeChild(hElem);
                    break;
                  }

                  tokenIndex++;
                  continue;
                }

                // פסקאות
                if (currentTok.type === 'p') {
                  let words = pendingWordTokens ? pendingWordTokens.remainingWords : currentTok.text.split(' ');
                  let isContinuation = pendingWordTokens ? true : false;

                  const pElem = document.createElement('p');
                  pElem.setAttribute('data-token-id', currentTok.id);
                  targetCol.appendChild(pElem);

                  if (currentTok.sideNote && !headingPageMap[currentTok.id]) {
                    headingPageMap[currentTok.id] = toGematria(pageIndex - 1);
                  }

                  let low = 1, high = words.length, bestFit = 0;
                  while (low <= high) {
                    let mid = Math.floor((low + high) / 2);
                    let testSlice = words.slice(0, mid).join(' ');
                    pElem.className = (mid >= words.length) ? 'p-end' : 'p-cut';
                    pElem.innerHTML = createDropWord(testSlice, isContinuation);

                    if (targetCol.scrollHeight <= effectiveColLimit) {
                      bestFit = mid;
                      low = mid + 1;
                    } else {
                      high = mid - 1;
                    }
                  }

                  if (bestFit === 0 && targetCol.children.length > 1) {
                    targetCol.removeChild(pElem);
                    break;
                  }
                  if (bestFit === 0) bestFit = Math.min(8, words.length);

                  const chunk = words.slice(0, bestFit).join(' ');
                  const isEndOfP = (bestFit >= words.length);
                  pElem.className = isEndOfP ? 'p-end' : 'p-cut';
                  pElem.innerHTML = createDropWord(chunk, isContinuation);

                  if (!isContinuation && currentTok.sideNote) {
                    const noteElem = document.createElement('div');
                    noteElem.className = 'side-note-anchor';
                    noteElem.textContent = currentTok.sideNote;
                    targetMargin.appendChild(noteElem);
                    pagePendingNotes.push({ elem: noteElem, pElem: pElem });
                  }

                  if (isEndOfP) {
                    pendingWordTokens = null;
                    tokenIndex++;
                  } else {
                    pendingWordTokens = { token: currentTok, remainingWords: words.slice(bestFit) };
                    break;
                  }
                }
              }
            });

            // איזון הבלוק
            const usedBlockH = Math.max(rCol.scrollHeight, lCol.scrollHeight);
            justifyColumnVertically(rCol, usedBlockH);
            justifyColumnVertically(lCol, usedBlockH);

            remPageHeight -= usedBlockH;

            // אם נגמר כל המקטע בעמוד זה
            if (tokenIndex >= secTokens.length && !pendingWordTokens) {
              const divHTML = getSectionDividerHTML(secDivStyle);
              if (divHTML) {
                const divContainer = document.createElement('div');
                divContainer.innerHTML = divHTML;
                pageLayout.bodyFlow.appendChild(divContainer.firstElementChild);
              }
              break;
            }
          }

          pagePendingNotes.forEach(item => {
            if (item.elem && item.pElem) {
              item.elem.style.top = item.pElem.offsetTop + 'px';
            }
          });
        }
      }

      // הטבעת מספרי עמודים מדויקים בתוכן העניינים
      document.querySelectorAll('.toc-page-num[data-target-id], .l7-page[data-target-id]').forEach(span => {
        const targetId = span.getAttribute('data-target-id');
        if (targetId && headingPageMap[targetId]) {
          span.textContent = headingPageMap[targetId];
        }
      });
    }

    // -------------------------------------------------------------
    // בניית מבנה נתונים מובנה לתוכן עניינים
    // -------------------------------------------------------------
    function buildStructuredTOC(tokenList, allowedLevels) {
      const entries = [];
      let currentLvl7Group = [];

      function flushLvl7() {
        if (currentLvl7Group.length > 0) {
          entries.push({ isLvl7Group: true, items: currentLvl7Group.slice() });
          currentLvl7Group = [];
        }
      }

      tokenList.forEach(t => {
        if (t.type.startsWith('h')) {
          if (allowedLevels.includes(t.level)) {
            flushLvl7();
            entries.push({ id: t.id, level: t.level, text: t.text, isLvl7Group: false });
          }
        } else if (t.type === 'p' && t.sideNote) {
          if (allowedLevels.includes(7)) {
            currentLvl7Group.push({ id: t.id, text: t.sideNote });
          }
        }
      });

      flushLvl7();
      return entries;
    }

    // -------------------------------------------------------------
    // רנדור תוכן עניינים רב-דפי
    // -------------------------------------------------------------
    function renderPaginatedTOC(container, entries, titleText, headerRight, headerLeft, startPNum, topOrnStyle) {
      if (entries.length === 0) return 0;

      const topOrnHTML = getTopOrnamentHTML(topOrnStyle);
      const ITEMS_PAGE_1 = 20;
      const ITEMS_PAGE_REST = 28;

      let curIdx = 0;
      let pagesCount = 0;

      while (curIdx < entries.length) {
        const isFirstTOCPage = (pagesCount === 0);
        const limit = isFirstTOCPage ? ITEMS_PAGE_1 : ITEMS_PAGE_REST;
        const pageItems = entries.slice(curIdx, curIdx + limit);
        curIdx += limit;
        pagesCount++;

        const page = document.createElement('div');
        page.className = 'a4-page toc-page';

        let itemsHTML = '';
        pageItems.forEach(it => {
          if (it.isLvl7Group) {
            const inlineSpans = it.items.map(l7 => 
              `<span class="l7-title">${l7.text}</span> - <span class="l7-page" data-target-id="${l7.id}"></span>`
            ).join('<span class="l7-sep">|</span>');
            itemsHTML += `<div class="toc-lvl-7-inline-block">${inlineSpans}</div>`;
          } else {
            itemsHTML += `
              <div class="toc-item toc-lvl-${it.level}">
                <span class="toc-title">${it.text}</span>
                <span class="toc-dots"></span>
                <span class="toc-page-num" data-target-id="${it.id}"></span>
              </div>
            `;
          }
        });

        const topHeader = `
          <div class="top-header-grid">
            <div class="header-right-col">${headerRight}</div>
            <div class="header-center-ornament">${topOrnHTML}</div>
            <div class="header-left-col">${headerLeft}</div>
          </div>
        `;

        const mainTitleBlock = isFirstTOCPage ? `<div class="title-level-2-standalone" style="margin-top: 40px; margin-bottom: 25px;">${titleText}</div>` : '';

        page.innerHTML = `
          ${topHeader}
          ${mainTitleBlock}
          <div class="toc-grid-full">${itemsHTML}</div>
          <div class="page-number-footer">${toGematria(startPNum + pagesCount - 1)}</div>
        `;
        container.appendChild(page);
      }

      return pagesCount;
    }

    // -------------------------------------------------------------
    // יצירת עמוד טקסט
    // -------------------------------------------------------------
    function createPageLayout(container, h2Text, h2TokenId, pNum, h1Title, h2Title, topOrnStyle) {
      const page = document.createElement('div');
      page.className = 'a4-page';

      const topOrnHTML = getTopOrnamentHTML(topOrnStyle);

      page.innerHTML = `
        <div class="top-header-grid">
          <div class="header-right-col">${h1Title}</div>
          <div class="header-center-ornament">${topOrnHTML}</div>
          <div class="header-left-col">${h2Title}</div>
        </div>
        ${h2Text ? `<div class="title-level-2-standalone" ${h2TokenId !== undefined ? `data-token-id="${h2TokenId}"` : ''}>${h2Text}</div>` : ''}
        <div class="page-body-flow ${h2Text ? 'has-h2' : ''}"></div>
        <div class="page-number-footer">${toGematria(pNum)}</div>
      `;

      container.appendChild(page);

      const bodyFlow = page.querySelector('.page-body-flow');
      const maxColHeight = h2Text ? 660 : 875;

      return { page, bodyFlow, maxColHeight };
    }

    function measureRemainingHeight(tokensList, startIndex, pending, colWidthPx) {
      const measureBox = document.getElementById('measuring-box');
      measureBox.style.width = colWidthPx + 'px';
      measureBox.innerHTML = '';
      let dummy = document.createElement('div');
      dummy.style.width = colWidthPx + 'px';

      if (pending) {
        let p = document.createElement('p');
        p.className = 'p-cut';
        p.innerHTML = createDropWord(pending.remainingWords.join(' '), true);
        dummy.appendChild(p);
      }
      for (let i = startIndex; i < tokensList.length; i++) {
        let tok = tokensList[i];
        if (tok.type.startsWith('h')) {
          let h = document.createElement('div');
          h.className = `title-level-${tok.level}`;
          h.textContent = tok.text;
          dummy.appendChild(h);
        } else if (tok.type === 'p') {
          let p = document.createElement('p');
          p.className = 'p-end';
          p.innerHTML = createDropWord(tok.text, false);
          dummy.appendChild(p);
        }
      }
      measureBox.appendChild(dummy);
      const h = dummy.offsetHeight;
      measureBox.innerHTML = '';
      return h;
    }

    // -------------------------------------------------------------
    // רנדור שער ראשי
    // -------------------------------------------------------------
    function renderMainShaar(container, style) {
      const page = document.createElement('div');
      page.className = `a4-page main-shaar-page main-template-${style}`;

      const title = document.getElementById('inp-book-title').value || "ספר";
      const subtitle = document.getElementById('inp-book-subtitle').value || "";
      const desc = document.getElementById('inp-book-desc').value || "";
      const sections = document.getElementById('inp-book-sections').value || "";
      const author = document.getElementById('inp-book-author').value || "";
      const year = document.getElementById('inp-book-year').value || "";

      let frameHTML = '';
      if (style === '1') {
        frameHTML = `
          <div class="m1-bg-top"></div><div class="m1-bg-middle"></div><div class="m1-bg-bottom"></div>
          <div class="m1-panel"><div class="m1-damask right"></div><div style="flex-grow:1;"></div><div class="m1-damask left"></div></div>
        `;
      } else if (style === '2') {
        frameHTML = `
          <div class="m2-bg-top"></div><div class="m2-bg-middle"></div><div class="m2-bg-bottom"></div>
          <div class="m2-panel"><div class="m2-lace right"></div><div style="flex-grow:1;"></div><div class="m2-lace left"></div></div>
        `;
      } else if (style === '3') {
        frameHTML = `
          <div class="m3-wavy-band"></div>
          <div class="m3-panel">
            <svg class="m3-corner tr" viewBox="0 0 100 100"><path d="M90,10 L30,10 C15,10 10,25 25,35 C35,42 45,35 40,25 C36,18 25,20 22,16 C30,14 60,14 75,14 C78,30 78,60 76,78 C72,75 74,64 67,60 C57,55 50,65 57,75 C67,90 82,85 82,70 L82,10 Z"/></svg>

      page.innerHTML = `
        ${frameHTML}

    // -------------------------------------------------------------
    // רנדור שער משנה (כותרת 1): טור מוצב בשמאל, ממורכז אנכית
    // -------------------------------------------------------------
    function renderSubShaar(container, token, style) {
      const page = document.createElement('div');
      page.className = 'a4-page sub-shaar-page';
      page.setAttribute('data-token-id', token.id);
      
      let titleMain = token.text;
      let titleSub = '';

      if (token.text.includes('-') || token.text.includes('–') || token.text.includes('—')) {
        const parts = token.text.split(/[-–—]/);
        titleMain = parts[0].trim();
        titleSub = parts.slice(1).join(' - ').trim();
      }

      let innerLace = '';
      if (style === '2') {
        innerLace = '<div class="m2-lace" style="border-left: 1px solid #ddd;"></div>';
      }

      page.innerHTML = `
        <div class="sub-shaar-bg-right"></div>
        <div class="sub-shaar-col">
          <div class="sub-shaar-content-centered" style="flex-grow: 1;">
            <div class="sefer-label">חלק</div>
            <div class="book-title-main" style="font-size: 36pt;">${titleMain}</div>
            ${titleSub ? `
              <svg style="width: 140px; height: 25px; margin: 15px auto;" viewBox="0 0 300 30">
                <path d="M10,15 Q75,5 140,15 Q145,10 150,5 Q155,10 160,15 Q225,5 290,15 Q225,25 160,15 Q155,20 150,25 Q145,20 140,15 Q75,25 10,15 Z" fill="#222"/>
              </svg>
              <div class="book-subtitle" style="font-size: 21pt;">${titleSub}</div>` : ''}
          </div>
          ${innerLace}
        </div>
      `;
      container.appendChild(page);
    }

    // -------------------------------------------------------------
    // סנכרון סמן טקסט
    // -------------------------------------------------------------
    const textarea = document.getElementById('raw-input');

    function syncCursorToPreview() {
      const cursorPos = textarea.selectionStart;
      const textBefore = textarea.value.substring(0, cursorPos);
      const currentLineIdx = textBefore.split('\n').length - 1;

      if (lineToTokenMap && lineToTokenMap[currentLineIdx] !== undefined) {
        let tokenId = lineToTokenMap[currentLineIdx];
        if (tokenId === null) {
          for (let k = currentLineIdx - 1; k >= 0; k--) {
            if (lineToTokenMap[k] !== null && lineToTokenMap[k] !== undefined) {
              tokenId = lineToTokenMap[k];
              break;
            }
          }
        }

        if (tokenId !== null && tokenId !== undefined) {
          const targetEl = document.querySelector(`[data-token-id="${tokenId}"]`);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      }
    }

    textarea.addEventListener('click', syncCursorToPreview);
    textarea.addEventListener('keyup', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End'].includes(e.key)) {
        syncCursorToPreview();
      }
    });

    window.onload = function() {
      toggleCustomTopInput();
    };
  </script>
