<!DOCTYPE html>
<html lang="he" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מערכת עימוד תורנית מקצועית לדפי A4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bellefair&family=David+Libre:wght@400;700&family=Frank+Ruhl+Libre:wght@400;700;900&family=Noto+Serif+Hebrew:wght@400;700;900&family=Assistant:wght@400;600;700&display=swap');

  :root {
    --fn-header-r: 'AAd_Livorna4', 'David Libre', 'David', serif;
    --sz-header-r: 13pt;
    --fn-header-c: 'AAd_Livorna4', 'David Libre', 'David', serif;
    --sz-header-c: 11pt;
    --fn-header-l: 'AAd_Livorna4', 'David Libre', 'David', serif;
    --sz-header-l: 13pt;

    --fn-h0: 'David Libre', 'David', serif;
    --sz-h0: 18pt;
    --fn-h0-body: 'Frank Ruhl Libre', serif;
    --sz-h0-body: 11.5pt;

    --fn-h1: 'Lia Sgula', 'Bellefair', serif;
    --sz-h1: 50pt;

    --fn-h2: 'AAd_AlphaBlack', 'David Libre', 'David', serif;
    --sz-h2: 17pt;
    --fn-h3: 'AAd_AlphaLight', 'Noto Serif Hebrew', serif;
    --sz-h3: 13.5pt;
    --fn-h4: 'FrankRuehl', 'Frank Ruhl Libre', serif;
    --sz-h4: 12.5pt;
    --fn-h5: 'David Libre', 'David', serif;
    --sz-h5: 11.5pt;
    --fn-h6: 'Noto Serif Hebrew', serif;
    --sz-h6: 10.5pt;
    --fn-h7: 'Hadassah Friedlaender', 'Hadassah', 'Noto Serif Hebrew', serif;
    --sz-h7: 6pt;

    --fn-sh-title: 'Bellefair', serif;
    --sz-sh-title: 46pt;
    --fn-sh-sub: 'David Libre', serif;
    --sz-sh-sub: 21pt;
    --fn-sh-desc: 'Frank Ruhl Libre', serif;
    --sz-sh-desc: 12pt;
    --fn-sh-sec: 'David Libre', serif;
    --sz-sh-sec: 11.5pt;
    --fn-sh-author: 'David Libre', serif;
    --sz-sh-author: 15pt;
    --fn-sh-year: 'David Libre', serif;
    --sz-sh-year: 12pt;

    --fn-body: 'Rashi DP', 'Frank Ruhl Libre', serif;
    --sz-body: 11.2pt;
    --fn-first-word: 'Rashi DP', 'Frank Ruhl Libre', serif;
    --sz-first-word: 1.5em;

    --w-margin: 7.5%;
    --w-gap: 2%;
    --w-col: 40%;
    --w-gutter: 2%;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    background-color: #555555;
    font-family: var(--fn-body);
    color: #000000;
    display: flex;
    flex-direction: row;
  }

  #sidebar {
    width: 530px;
    min-width: 380px;
    max-width: 780px;
    height: 100vh;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    padding: 10px 14px;
    box-shadow: -3px 0 15px rgba(0,0,0,0.3);
    z-index: 100;
    font-family: 'David Libre', serif;
    flex-shrink: 0;
    overflow-y: auto;
  }

  #resizer {
    width: 6px;
    height: 100vh;
    background: #333333;
    cursor: col-resize;
    flex-shrink: 0;
    z-index: 110;
  }
  #resizer:hover, #resizer.resizing { background: #b8860b; }

  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .sidebar-title { font-size: 12.5pt; font-weight: 700; }

  .btn-load-fonts {
    background-color: #2c3e50;
    color: #fff;
    border: none;
    padding: 3px 8px;
    font-size: 8.5pt;
    font-weight: 700;
    cursor: pointer;
    border-radius: 3px;
  }

  #raw-input {
    width: 100%;
    height: 180px;
    font-family: monospace;
    font-size: 9pt;
    padding: 6px;
    border: 1px solid #777;
    border-radius: 3px;
    direction: rtl;
    resize: vertical;
  }

  .panel-static {
    background: #fbfbfb;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin-bottom: 10px;
    padding: 8px 10px;
  }

  .panel-header {
    font-size: 10pt;
    font-weight: 700;
    background: #eaeaea;
    padding: 4px 8px;
    border-radius: 3px;
    margin: -8px -10px 8px -10px;
    color: #111;
    border-bottom: 1px solid #ccc;
  }

  .inline-cfg-row {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 5px;
    font-size: 8.5pt;
  }
  .inline-cfg-row label { font-weight: 700; width: 105px; flex-shrink: 0; font-size: 8pt; }
  .inline-cfg-row input[type="text"] { flex: 1; min-width: 80px; padding: 2px 4px; font-size: 8.5pt; border: 1px solid #aaa; border-radius: 2px; }
  .inline-cfg-row select { padding: 2px 3px; font-size: 8pt; border: 1px solid #aaa; border-radius: 2px; }
  .inline-cfg-row select.font-picker { width: 100px; }
  .inline-cfg-row input.size-input { width: 38px; text-align: center; font-size: 8pt; padding: 2px; border: 1px solid #aaa; border-radius: 2px; }

  .btn-bar-bottom {
    display: flex;
    gap: 6px;
    padding-top: 8px;
    border-top: 1.5px solid #ccc;
    background: #fff;
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
  }
  .btn-primary {
    background-color: #000;
    color: #fff;
    border: none;
    padding: 8px 12px;
    font-size: 10pt;
    font-weight: 700;
    cursor: pointer;
    border-radius: 3px;
    flex-grow: 1;
  }
  .btn-save-template {
    background-color: #1e3a8a;
    color: #fff;
    border: none;
    padding: 8px 10px;
    font-size: 9pt;
    font-weight: 700;
    cursor: pointer;
    border-radius: 3px;
  }
  .btn-secondary {
    background-color: #f0f0f0;
    color: #000;
    border: 1px solid #666;
    padding: 8px 10px;
    font-size: 9pt;
    cursor: pointer;
    border-radius: 3px;
  }

  #preview-pane {
    flex-grow: 1;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 25px 20px;
    background-color: #555555;
  }

  .a4-page {
    background-color: #ffffff;
    width: 210mm;
    height: 297mm;
    max-height: 297mm;
    padding: 15mm 15mm 15mm 15mm;
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
    position: relative;
    margin-bottom: 30px;
    page-break-after: always;
    overflow: hidden;
    flex-shrink: 0;
  }

  .page-content-wrapper {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    position: relative;
  }

  .main-shaar-page {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 0;
  }

  .shaar-main-content {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    padding: 20mm 12mm 16mm 12mm;
    z-index: 20;
    position: relative;
  }

  .bsd-header { font-family: 'David Libre', serif; font-size: 11pt; font-weight: 700; color: #444; }
  .sefer-label { font-family: 'David Libre', serif; font-size: 15pt; letter-spacing: 5px; font-weight: 700; margin-top: 4px; }
  .book-title-main { font-family: var(--fn-sh-title); font-size: var(--sz-sh-title); line-height: 1.1; margin: 10px 0 4px 0; }
  .book-subtitle { font-family: var(--fn-sh-sub); font-size: var(--sz-sh-sub); font-weight: 700; line-height: 1.25; }
  .book-description { font-family: var(--fn-sh-desc); font-size: var(--sz-sh-desc); line-height: 1.5; max-width: 65%; margin: 10px auto; }
  .book-sections-summary { font-family: var(--fn-sh-sec); font-size: var(--sz-sh-sec); line-height: 1.5; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; padding: 6px 12px; margin: 8px 0; font-weight: 700; }
  .author-block { font-family: var(--fn-sh-author); font-size: calc(var(--sz-sh-author) * 0.85); line-height: 1.3; }
  .author-name { font-size: var(--sz-sh-author); font-weight: 700; }
  .publication-footer { font-family: var(--fn-sh-year); font-size: var(--sz-sh-year); font-weight: 700; letter-spacing: 1px; }

  .m1-bg-top { position: absolute; top: 0; left: 0; right: 0; height: 20%; background: linear-gradient(135deg, #f2f2f2 0%, #e2e2e2 100%); border-bottom: 1px solid #d0d0d0; }
  .m1-bg-middle { position: absolute; top: 20%; left: 0; right: 0; height: 60%; background: #ffffff; }
  .m1-bg-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 20%; background: linear-gradient(135deg, #f2f2f2 0%, #e2e2e2 100%); border-top: 1px solid #d0d0d0; }
  .m1-panel { position: absolute; top: 0; bottom: 0; left: 12%; right: 12%; background: #ffffff; border-right: 1px solid #ccc; border-left: 1px solid #ccc; box-shadow: 0 0 20px rgba(0,0,0,0.1); display: flex; justify-content: space-between; z-index: 10; }
  .m1-damask { width: 30px; height: 100%; background: #fafafa url("data:image/svg+xml,%3Csvg width='32' height='55' viewBox='0 0 32 55' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M16,27 C10,22 5,14 5,5 C5,0 10,0 16,5 C22,0 27,0 27,5 C27,14 22,22 16,27 Z M16,27 C10,32 5,40 5,49 C5,55 10,55 16,49 C22,55 27,55 27,49 C27,40 22,32 16,27 Z M16,14 A3.5,3.5 0 1,0 16,21 A3.5,3.5 0 1,0 16,14 Z' fill='%239e9e9e' fill-opacity='0.35'/%3E%3C/svg%3E") repeat-y; flex-shrink: 0; }
  
  .m2-bg-top { position: absolute; top: 0; left: 0; right: 0; height: 18%; background: #eaeaea; }
  .m2-bg-middle { position: absolute; top: 18%; left: 0; right: 0; height: 64%; background: #ffffff; box-shadow: inset 0 2px 6px rgba(0,0,0,0.06), inset 0 -2px 6px rgba(0,0,0,0.06); }
  .m2-bg-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 18%; background: #eaeaea; }
  .m2-panel { position: absolute; top: 0; bottom: 0; left: 10%; right: 10%; background: #ffffff; box-shadow: 0 0 25px rgba(0,0,0,0.12); display: flex; justify-content: space-between; z-index: 10; }
  .m2-lace { width: 24px; height: 100%; background: #ffffff url("data:image/svg+xml,%3Csvg width='26' height='40' viewBox='0 0 26 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M13,20 C4,16 2,8 2,2 C2,0 8,0 13,8 C18,0 24,0 24,2 C24,8 22,16 13,20 Z M13,20 C4,24 2,32 2,38 C2,40 8,40 13,32 C18,40 24,40 24,38 C24,32 22,24 13,20 Z M13,10 A3,3 0 1,0 13,16 A3,3 0 1,0 13,10 Z M13,30 A3,3 0 1,0 13,24 A3,3 0 1,0 13,30 Z' fill='%23888888' fill-opacity='0.45'/%3E%3C/svg%3E") repeat-y; flex-shrink: 0; }

  .m3-wavy-band { position: absolute; top: 14%; left: 0; right: 0; height: 72%; background: #ffffff; border-top: 1.5px solid #d4d4d4; border-bottom: 1.5px solid #d4d4d4; }
  .m3-panel { position: absolute; top: 0; bottom: 0; left: 9%; right: 9%; background: #ffffff; border-right: 1.5px solid #ccc; border-left: 1.5px solid #ccc; box-shadow: 0 0 25px rgba(0,0,0,0.14); z-index: 10; }
  .m3-corner { position: absolute; width: 65px; height: 65px; fill: #111; z-index: 25; }
  .m3-corner.tr { top: 10mm; right: 10mm; }
  .m3-corner.tl { top: 10mm; left: 10mm; transform: scaleX(-1); }
  .m3-corner.br { bottom: 10mm; right: 10mm; transform: scaleY(-1); }
  .m3-corner.bl { bottom: 10mm; left: 10mm; transform: scale(-1, -1); }

  .sub-shaar-page { position: relative; padding: 0; }
  .sub-shaar-col {
    position: absolute;
    top: 0; bottom: 0;
    left: 0;
    right: auto;
    width: 55%;
    background: #ffffff;
    border-right: 1.5px solid #ccc;
    box-shadow: 5px 0 18px rgba(0,0,0,0.08);
    display: flex;
    z-index: 10;
  }
  .sub-shaar-bg-right {
    position: absolute;
    top: 0; bottom: 0;
    right: 0; left: 55%;
    background: #f4f4f4;
  }
  .sub-shaar-content-centered {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20mm 12mm;
  }

  .toc-page { padding: 15mm 15mm 15mm 15mm; }
  .toc-grid-full {
    display: flex;
    flex-direction: column;
    gap: 3px;
    width: 100%;
    max-width: 175mm;
    margin: 0 auto;
  }
  .toc-entry-group { break-inside: avoid; margin-bottom: 3px; }
  .toc-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2px;
    font-family: 'David Libre', serif;
    font-size: 10.5pt;
  }
  .toc-title {
    flex-shrink: 1;
    max-width: 84%;
    font-weight: 600;
    white-space: normal;
    word-wrap: break-word;
    overflow-wrap: break-word;
    text-align: right;
    line-height: 1.3;
  }
  .toc-dots {
    flex-grow: 1;
    border-bottom: 1px dotted #777;
    margin: 0 8px;
    height: 1px;
    min-width: 25px;
  }
  .toc-page-num {
    flex-shrink: 0;
    font-weight: 700;
    font-family: 'David Libre', serif;
    font-size: 10.5pt;
    min-width: 25px;
    text-align: left;
  }
  .toc-lvl-1 { font-size: 12pt; font-weight: 700; margin-top: 8px; margin-bottom: 3px; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
  .toc-lvl-2 { font-size: 11pt; font-weight: 700; margin-top: 5px; padding-right: 8px; }
  .toc-lvl-3 { font-size: 10.5pt; font-weight: 700; padding-right: 16px; }
  .toc-lvl-4 { padding-right: 24px; font-size: 10pt; }
  .toc-lvl-5 { padding-right: 32px; font-size: 9.5pt; }
  .toc-lvl-6 { padding-right: 40px; font-size: 9pt; }

  .top-header-grid {
    display: grid;
    grid-template-columns: var(--w-margin) var(--w-gap) var(--w-col) var(--w-gutter) var(--w-col) var(--w-gap) var(--w-margin);
    align-items: center;
    height: 24px;
    flex-shrink: 0;
    margin-bottom: 18px;
  }
  .header-col-r {
    grid-column: 3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--fn-header-r);
    font-size: var(--sz-header-r);
    font-weight: 700;
  }
  .header-col-c {
    grid-column: 4;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    overflow: visible;
    font-family: var(--fn-header-c);
    font-size: var(--sz-header-c);
  }
  .header-col-l {
    grid-column: 5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--fn-header-l);
    font-size: var(--sz-header-l);
    font-weight: 700;
  }

  .title-level-2-standalone {
    font-family: var(--fn-h2);
    font-size: var(--sz-h2);
    font-weight: 700;
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
    width: 100%;
    line-height: 1.25;
    flex-shrink: 0;
  }

  .page-body-flow {
    display: flex;
    flex-direction: column;
    width: 100%;
    position: relative;
    flex-grow: 1;
    justify-content: flex-start;
    min-height: 0;
  }

  .page-spacer {
    flex-grow: 0;
    flex-shrink: 0;
    height: 18px;
  }

  .block-2col {
    display: grid;
    grid-template-columns: var(--w-margin) var(--w-gap) var(--w-col) var(--w-gutter) var(--w-col) var(--w-gap) var(--w-margin);
    width: 100%;
    position: relative;
    align-items: start;
  }

  .block-h3-span {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 10px 0 6px 0;
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  .block-h3-span .h3-title-text {
    font-family: var(--fn-h3);
    font-size: var(--sz-h3);
    font-weight: 900;
    text-align: center;
    width: 100%;
    line-height: 1.22;
  }

  .title-level-4 { font-family: var(--fn-h4); font-size: var(--sz-h4); font-weight: 900; text-align: center; margin: 9px 0 4px 0; line-height: 1.22; }
  .title-level-5 { font-family: var(--fn-h5); font-size: var(--sz-h5); font-weight: 700; text-align: center; margin: 7px 0 3px 0; line-height: 1.22; }
  .title-level-6 { font-family: var(--fn-h6); font-size: var(--sz-h6); font-weight: 700; text-align: center; margin: 6px 0 3px 0; line-height: 1.22; }

  .block-single-col {
    display: grid;
    grid-template-columns: var(--w-margin) var(--w-gap) calc(var(--w-col)*2 + var(--w-gutter)) var(--w-gap) var(--w-margin);
    width: 100%;
    position: relative;
    align-items: start;
  }
  .block-single-col .single-wide-col {
    grid-column: 3;
    font-family: var(--fn-h0-body);
    font-size: var(--sz-h0-body);
    line-height: 1.45;
    text-align: justify;
    text-justify: inter-word;
  }

  .margin-notes-column {
    font-family: var(--fn-h7);
    font-size: var(--sz-h7);
    line-height: 1.18;
    text-align: center;
    text-align-last: center;
    font-weight: 400;
    color: #404040;
    position: relative;
    width: 100%;
    height: 100%;
  }
  .right-margin { grid-column: 1; }
  .left-margin { grid-column: 7; }
  .side-note-anchor { position: absolute; width: 100%; }

  .main-column {
    font-family: var(--fn-body);
    font-size: var(--sz-body);
    line-height: 1.34;
    text-align: justify;
    text-justify: inter-word;
    min-height: 0;
    height: auto;
    position: relative;
  }
  .right-col { grid-column: 3; }
  .left-col { grid-column: 5; }

  p { margin-bottom: 7px; text-align: justify; text-justify: inter-word; position: relative; }
  p.p-end { text-align-last: center; }
  p.p-cut { text-align-last: justify; }

  .first-word-window {
    float: right;
    font-family: var(--fn-first-word);
    font-size: var(--sz-first-word);
    font-weight: 900;
    line-height: 0.85;
    height: 1.25em;
    margin-left: 6px;
    margin-bottom: 1px;
    display: block;
  }
  .first-word-style {
    font-family: var(--fn-first-word);
    font-size: var(--sz-first-word);
    font-weight: 900;
    line-height: 0.85;
  }

  .page-number-footer {
    text-align: center;
    font-family: var(--fn-header-r);
    font-size: 12pt;
    font-weight: 700;
    height: 24px;
    flex-shrink: 0;
  }

  @media print {
    body { background: none; padding: 0; overflow: visible; display: block; }
    #sidebar, #resizer { display: none !important; }
    #preview-pane { height: auto !important; overflow: visible !important; padding: 0 !important; background: none !important; }
    .a4-page {
      box-shadow: none;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      max-height: 100vh;
      padding: 15mm 15mm 15mm 15mm;
      margin: 0;
      page-break-after: always;
    }
  }
</style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">מערכת עימוד תורנית A4</div>
      <button class="btn-load-fonts" onclick="loadSystemFonts()">📂 טען גופני Windows</button>
    </div>
    <textarea id="raw-input" placeholder="הדבק כאן את הטקסט המלא..."></textarea>

    <div style="margin-top: 10px;">
      <div class="panel-static">
        <div class="panel-header">👑 שער ראשי ושערי משנה</div>
        <div style="margin-bottom: 6px;">
          <label style="font-size: 8.5pt; font-weight: 700;"><input type="checkbox" id="show-main-shaar" checked> הצג שער ראשי</label>
        </div>
        <div class="inline-cfg-row" style="margin-bottom: 8px;">
          <label>סגנון שער:</label>
          <select id="main-shaar-style" style="flex:1;">
            <option value="1" selected>1. דמסק ושיש</option>
            <option value="2">2. תחרה כפולה</option>
            <option value="3">3. קרנות וילנא</option>
          </select>
        </div>
        <div class="inline-cfg-row">
          <label>שם הספר:</label>
          <input type="text" id="inp-book-title" value="שם הספר">
          <input type="number" id="s-sh-title" class="size-input" value="46">
        </div>
        <div class="inline-cfg-row">
          <label>נושא:</label>
          <input type="text" id="inp-book-subtitle" value="נושא הספר בתמצית">
          <input type="number" id="s-sh-sub" class="size-input" value="21">
        </div>
        <div class="inline-cfg-row">

  <script>
    // ============ מנהל גרירה ============
    const resizer = document.getElementById('resizer');
    const sidebar = document.getElementById('sidebar');
    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizer.classList.add('resizing');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const newWidth = document.body.clientWidth - e.clientX;
      if (newWidth >= 380 && newWidth <= 780) {
        sidebar.style.width = newWidth + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('resizing');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    // ============ כלי עזר ============
    function toGematria(num) {
      num = parseInt(num, 10);
      if (isNaN(num) || num <= 0) return "";
      if (num === 15) return "טו";
      if (num === 16) return "טז";
      const ones = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
      const tens = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
      const hundreds = ["", "ק", "ר", "ש", "ת", "תק", "תר", "תש", "תת", "תתק"];
      let str = "";
      let h = Math.floor(num / 100);
      if (h > 0) {
        if (h <= 4) str += ["", "ק", "ר", "ש", "ת"][h];
        else if (h < hundreds.length) str += hundreds[h];
        num %= 100;
      }
      let t = Math.floor(num / 10);
      let o = num % 10;
      if (t === 1 && (o === 5 || o === 6)) {
        str += (o === 5) ? "טו" : "טז";
      } else {
        str += tens[t] + ones[o];
      }
      return str;
    }

    function updateGrid() {
      const root = document.documentElement;
      // קריאת הערכים מהלוח (אם קיימים)
      const colEl = document.getElementById('prop-col');
      const marginEl = document.getElementById('prop-margin');
      const gutterEl = document.getElementById('prop-gutter');
      const gapEl = document.getElementById('prop-gap');
      if (colEl) root.style.setProperty('--w-col', colEl.value + '%');
      if (marginEl) root.style.setProperty('--w-margin', marginEl.value + '%');
      if (gutterEl) root.style.setProperty('--w-gutter', gutterEl.value + '%');
      if (gapEl) root.style.setProperty('--w-gap', gapEl.value + '%');
    }

    function updateStyles() {
      const root = document.documentElement;
      const fontBody = document.getElementById('font-body');
      const sizeBody = document.getElementById('size-body');
      const fontFw = document.getElementById('font-first-word');
      const sizeFw = document.getElementById('size-first-word');
      
      if (fontBody) root.style.setProperty('--fn-body', fontBody.value);
      if (sizeBody) root.style.setProperty('--sz-body', sizeBody.value + 'pt');
      if (fontFw) root.style.setProperty('--fn-first-word', fontFw.value);
      if (sizeFw) root.style.setProperty('--sz-first-word', sizeFw.value + 'em');

      const s = (id, prop) => {
        const el = document.getElementById(id);
        if (el) root.style.setProperty(prop, el.value + 'pt');
      };
      const f = (id, prop) => {
        const el = document.getElementById(id);
        if (el) root.style.setProperty(prop, el.value);
      };
      
      s('s-sh-title', '--sz-sh-title');
      s('s-sh-sub', '--sz-sh-sub');
      s('s-sh-desc', '--sz-sh-desc');
      s('s-sh-sec', '--sz-sh-sec');
      s('s-sh-author', '--sz-sh-author');
      s('s-sh-year', '--sz-sh-year');
      s('s-h0', '--sz-h0');
      s('s-h0-body', '--sz-h0-body');
      s('s-h1', '--sz-h1');
      s('s-h2', '--sz-h2');
      s('s-h3', '--sz-h3');
      s('s-h4', '--sz-h4');
      s('s-h5', '--sz-h5');
      s('s-h6', '--sz-h6');
      s('s-h7', '--sz-h7');
      s('s-hdr-r', '--sz-header-r');
      s('s-hdr-c', '--sz-header-c');
      s('s-hdr-l', '--sz-header-l');
    }

    function createDropWord(text, isContinuation) {
      if (isContinuation) return text;
      text = text.trim();
      if (!text) return '';
      const firstSpace = text.indexOf(' ');
      if (firstSpace === -1) {
        return `<span class="first-word-style">${text}</span>`;
      }
      const firstWord = text.substring(0, firstSpace);
      const rest = text.substring(firstSpace + 1);
      return `<span class="first-word-window">${firstWord}</span> ${rest}`;
    }

    function renderHeaderSectionHTML(type, h1Title, h2Title, bookTitle) {
      if (type === 'h1') return h1Title || '';
      if (type === 'h2') return h2Title || '';
      if (type === 'book_title') return bookTitle || '';

      if (type === 'spear') return '<svg style="height:9px; width:48px;" viewBox="0 0 400 40"><circle cx="200" cy="20" r="10" fill="none" stroke="#444" stroke-width="4.5"/><circle cx="200" cy="20" r="4.5" fill="#444"/><path d="M182,20 C182,24 165,27 140,27 C90,27 40,22 5,20 C40,18 90,13 140,13 C165,13 182,16 182,20 Z" fill="#444"/><path d="M218,20 C218,24 235,27 260,27 C310,27 360,22 395,20 C360,18 310,13 260,13 C235,13 218,16 218,20 Z" fill="#444"/></svg>';
      if (type === 'swash') return '<svg style="height:12px; width:44px; fill:#444;" viewBox="0 0 320 28"><path d="M10,14 C60,14 85,4 125,4 C145,4 152,11 160,17 C168,11 175,4 195,4 C235,4 260,14 310,14 C260,14 235,24 195,24 C175,24 168,17 160,11 C152,17 145,24 125,24 C85,24 60,14 10,14 Z M160,7 A5,5 0 1,0 160,21 A5,5 0 1,0 160,7 Z"/></svg>';
      return '';
    }

    function getSectionDividerHTML(type) {
      if (type === 'pyramid') return '<div style="grid-column: 3 / 6; text-align: center; line-height: 0.9; margin: 18px 0 6px 0;"><div style="font-size: 10pt; letter-spacing: 6px;">❖ ❖ ❖</div><div style="font-size: 9pt; letter-spacing: 5px; margin-top: 3px;">❖ ❖</div><div style="font-size: 8pt; margin-top: 3px;">❖</div></div>';
      if (type === 'spear') return '<div style="grid-column: 3 / 6; text-align: center; margin: 16px 0 6px 0;"><svg style="width: 200px; height: 22px; margin: auto;" viewBox="0 0 400 40"><circle cx="200" cy="20" r="10" fill="none" stroke="#000" stroke-width="4.5"/><circle cx="200" cy="20" r="4.5" fill="#000"/><path d="M182,20 C182,24 165,27 140,27 C90,27 40,22 5,20 C40,18 90,13 140,13 C165,13 182,16 182,20 Z" fill="#000"/><path d="M165,20 C165,22 150,24 130,24 C95,24 55,21 30,20 C55,19 95,16 130,16 C150,16 165,18 165,20 Z" fill="#fff"/><path d="M218,20 C218,24 235,27 260,27 C310,27 360,22 395,20 C360,18 310,13 260,13 C235,13 218,16 218,20 Z" fill="#000"/><path d="M235,20 C235,22 250,24 270,24 C305,24 345,21 370,20 C345,19 305,16 270,16 C250,16 235,18 235,20 Z" fill="#fff"/></svg></div>';
      return '';
    }

    function parseMetadataFromText(rawText) {
      const lines = rawText.split('\n');
      const cleanLines = [];
      const fields = {
        'inp-book-title': /^(?:שם הספר[:\s]*)?שם הספר\s*[-–—:]\s*(.*)$/i,
        'inp-book-subtitle': /^(?:נושא(?:\\|\/)כותרת משנה[:\s]*)?נושא\s*[-–—:]\s*(.*)$/i,
        'inp-book-desc': /^(?:נושא מפורט\s*(?:\\|\/)\s*תיאור[:\s]*)?נושא מפורט\s*[-–—:]\s*(.*)$/i,
        'inp-book-sections': /^(?:פרטי מהדורא\s*(?:\\|\/)\s*חלקים[:\s]*)?פרטי מהדורא\s*[-–—:]\s*(.*)$/i,
        'inp-book-author': /^(?:שם המחבר[:\s]*)?שם המחבר\s*[-–—:]\s*(.*)$/i,
        'inp-book-year': /^(?:מקום ושנת הוצאה[:\s]*)?מקום ושנת הוצאה\s*[-–—:]\s*(.*)$/i
      };
      const fieldTexts = {
        'inp-book-title': /^(?:שם הספר[:\s]*)?שם הספר\s*[-–—:]\s*/i,
        'inp-book-subtitle': /^(?:נושא(?:\\|\/)כותרת משנה[:\s]*)?נושא\s*[-–—:]\s*/i,
        'inp-book-desc': /^(?:נושא מפורט\s*(?:\\|\/)\s*תיאור[:\s]*)?נושא מפורט\s*[-–—:]\s*/i,
        'inp-book-sections': /^(?:פרטי מהדורא\s*(?:\\|\/)\s*חלקים[:\s]*)?פרטי מהדורא\s*[-–—:]\s*/i,
        'inp-book-author': /^(?:שם המחבר[:\s]*)?שם המחבר\s*[-–—:]\s*/i,
        'inp-book-year': /^(?:מקום ושנת הוצאה[:\s]*)?מקום ושנת הוצאה\s*[-–—:]\s*/i
      };

      for (let line of lines) {
        const trimmed = line.trim();
        let matched = false;
        for (let id in fields) {
          const m = trimmed.match(fields[id]);
          if (m) {
            document.getElementById(id).value = trimmed.replace(fieldTexts[id], '').trim();
            matched = true;
            break;
          }
        }
        if (!matched) cleanLines.push(line);
      }
      return cleanLines.join('\n');
    }

    // ============ מנוע עימוד ראשי ============
    function typesetDocument() {
      try {
        updateGrid();
        updateStyles();

        let rawText = document.getElementById('raw-input').value;
        if (!rawText || !rawText.trim()) {
          document.getElementById('book-container').innerHTML = '';
          return;
        }

        rawText = parseMetadataFromText(rawText);
        const container = document.getElementById('book-container');
        container.innerHTML = '';

        // פירוק לטוקנים
        const lines = rawText.split('\n');
        const tokens = [];
        let pendingSideNote = null;

        for (let line of lines) {
          const lineTrim = line.trim();
          if (!lineTrim) continue;

          const hMatch = lineTrim.match(/^כותרת\s*(\d+)\s*(?:מספר\s*\d+)?\s*[-–—]\s*(.*)$/);
          if (hMatch) {
            const lvl = parseInt(hMatch[1], 10);
            const txt = hMatch[2].trim();
            if (lvl === 7) {
              pendingSideNote = txt;
            } else {
              tokens.push({ id: tokens.length, type: 'h' + lvl, level: lvl, text: txt });
            }
          } else {
            tokens.push({ id: tokens.length, type: 'p', text: lineTrim, sideNote: pendingSideNote });
            pendingSideNote = null;
          }
        }

        const headingModes = {
          0: 'new_page_1col',
          1: 'sub_shaar',
          2: 'new_page_1col',
          3: 'span_1col',
          4: 'inline_2col',
          5: 'inline_2col',
          6: 'inline_2col',
          7: 'side_note'
        };

        // פיצול למקטעים
        const sections = [];
        let currentSection = { type: 'body', tokens: [] };

        for (let tok of tokens) {
          const mode = tok.type.startsWith('h') ? headingModes[tok.level] : 'inline_2col';
          if (mode === 'sub_shaar') {
            if (currentSection.tokens.length > 0) sections.push(currentSection);
            sections.push({ type: 'sub_shaar', token: tok, tokens: [] });
            currentSection = { type: 'body', tokens: [] };
          } else if (mode === 'new_page_1col') {
            if (currentSection.tokens.length > 0) sections.push(currentSection);
            currentSection = { type: 'new_page_1col', token: tok, isH0: (tok.level === 0), tokens: [] };
          } else {
            currentSection.tokens.push(tok);
          }
        }
        if (currentSection.tokens.length > 0) sections.push(currentSection);

        const headingPageMap = {};
        let pageIndex = 1;
        let currentH1Title = '';

        const bookTitle = document.getElementById('inp-book-title').value || "ספר";
        const showMainShaar = document.getElementById('show-main-shaar').checked;
        const mainShaarStyle = document.getElementById('main-shaar-style').value;
        const subShaarStyle = document.getElementById('sub-shaar-style').value;
        const secDivStyle = document.getElementById('section-divider-style').value;
        const enableGeneralTOC = document.getElementById('enable-general-toc').checked;
        const enableDetailedTOC = document.getElementById('enable-detailed-toc').checked;

        // שער ראשי
        if (showMainShaar) renderMainShaar(container, mainShaarStyle);

        // תוכן עניינים כללי
        if (enableGeneralTOC) {
          const tocEntries = [];
          for (let tok of tokens) {
            if (tok.type.startsWith('h') && tok.level <= 3) {
              tocEntries.push({ id: tok.id, level: tok.level, text: tok.text });
            }
          }
          const tocPages = renderPaginatedTOC(container, tocEntries, "תוכן העניינים הכללי", bookTitle, pageIndex);
          pageIndex += tocPages;
        }

        // עימוד גוף הספר
        for (let sec of sections) {
          if (sec.type === 'sub_shaar') {
            renderSubShaar(container, sec.token, subShaarStyle);
            currentH1Title = sec.token.text.split(/[-–—]/)[0].trim();
            headingPageMap[sec.token.id] = toGematria(pageIndex);

            // תוכן עניינים מפורט
            if (enableDetailedTOC) {
              let inThisH1 = false;
              const thisH1Tokens = [];
              for (let t of tokens) {
                if (t.id === sec.token.id) { inThisH1 = true; continue; }
                if (inThisH1 && t.type.startsWith('h') && headingModes[t.level] === 'sub_shaar') break;
                if (inThisH1) thisH1Tokens.push(t);
              }
              const detailedEntries = [];
              for (let t of thisH1Tokens) {
                if (t.type.startsWith('h') && t.level >= 2 && t.level <= 6) {
                  detailedEntries.push({ id: t.id, level: t.level, text: t.text });
                }
              }
              if (detailedEntries.length > 0) {
                const dtocPages = renderPaginatedTOC(container, detailedEntries, "מפתח ולוח עניינים מפורט", currentH1Title, pageIndex);
                pageIndex += dtocPages;
              }
            }
            continue;
          }

          // עימוד סקציה רגילה
          const isH0 = !!sec.isH0;
          let h2Text = (sec.type === 'new_page_1col') ? sec.token.text : '';
          let h2Id = (sec.type === 'new_page_1col') ? sec.token.id : undefined;
          if (h2Text) headingPageMap[h2Id] = toGematria(pageIndex);

          let tokenIndex = 0;
          let pendingWordTokens = null;
          let isFirstPage = true;

          while (tokenIndex < sec.tokens.length || pendingWordTokens) {
            const page = createPageLayout(container, isFirstPage ? h2Text : '', isFirstPage ? h2Id : undefined, pageIndex, currentH1Title, h2Text, bookTitle);
            pageIndex++;
            isFirstPage = false;

            const maxH = page.maxColHeight;
            const rCol = page.rCol;
            const lCol = page.lCol;
            const rMargin = page.rMargin;
            const lMargin = page.lMargin;
            const colWidth = 272;

            if (isH0) {
              // עמוד טור אחד
              const singleCol = page.singleCol;
              while ((tokenIndex < sec.tokens.length || pendingWordTokens) && singleCol.scrollHeight < maxH - 5) {
                let currentTok = pendingWordTokens ? pendingWordTokens.token : sec.tokens[tokenIndex];

                if (currentTok.type.startsWith('h')) {
                  const hElem = document.createElement('div');
                  hElem.className = 'title-level-' + currentTok.level;
                  hElem.textContent = currentTok.text;
                  hElem.setAttribute('data-token-id', currentTok.id);
                  singleCol.appendChild(hElem);
                  headingPageMap[currentTok.id] = toGematria(pageIndex - 1);
                  tokenIndex++;
                  continue;
                }

                const words = pendingWordTokens ? pendingWordTokens.remainingWords : currentTok.text.split(/\s+/);
                const isCont = !!pendingWordTokens;
                const pElem = document.createElement('p');
                pElem.setAttribute('data-token-id', currentTok.id);
                pElem.className = 'p-end';
                pElem.innerHTML = createDropWord(words.join(' '), isCont);
                singleCol.appendChild(pElem);

                if (singleCol.scrollHeight > maxH && singleCol.children.length > 1) {
                  singleCol.removeChild(pElem);
                  break;
                }
                pendingWordTokens = null;
                tokenIndex++;
              }
              continue;
            }

            // עימוד שני טורים - מילוי הדרגתי
            const block2Col = page.block2Col;
            let rTokensConsumed = 0;
            let lTokensConsumed = 0;
            const pageNotes = [];

            // שלב 1: מילוי טור ימני
            let rCanFit = true;
            while (rCanFit && (tokenIndex < sec.tokens.length || pendingWordTokens)) {
              let currentTok = pendingWordTokens ? pendingWordTokens.token : sec.tokens[tokenIndex];
              const curMode = currentTok.type.startsWith('h') ? headingModes[currentTok.level] : 'inline_2col';

              // כותרת span - נצטרך לטפל בה בנפרד
              if (curMode === 'span_1col' && !pendingWordTokens) {
                break;
              }

              // ניסיון הוספה
              const testElem = createElementForToken(currentTok, rCol, rMargin, true, pendingWordTokens, pageNotes);
              if (!testElem) {
                rCanFit = false;
                break;
              }

              const beforeH = rCol.scrollHeight;
              rCol.appendChild(testElem);
              const afterH = rCol.scrollHeight;
              const consumed = (afterH - beforeH);

              if (afterH > maxH) {
                rCol.removeChild(testElem);
                rCanFit = false;
                break;
              }

              rTokensConsumed++;
              if (currentTok.sideNote && !headingPageMap[currentTok.id]) {
                headingPageMap[currentTok.id] = toGematria(pageIndex - 1);
              }
              if (currentTok.type.startsWith('h') && !headingPageMap[currentTok.id]) {
                headingPageMap[currentTok.id] = toGematria(pageIndex - 1);
              }
              pendingWordTokens = null;
              tokenIndex++;
            }

            // אם נשארו כותרות span - הוסף אותן כ-span בין הטורים
            while (tokenIndex < sec.tokens.length && sec.tokens[tokenIndex].type.startsWith('h') && headingModes[sec.tokens[tokenIndex].level] === 'span_1col') {
              const spanH = sec.tokens[tokenIndex];
              const spanBlock = document.createElement('div');
              spanBlock.className = 'block-h3-span';
              spanBlock.innerHTML = `<div class="h3-title-text" data-token-id="${spanH.id}">${spanH.text}</div>`;
              page.bodyFlow.appendChild(spanBlock);
              headingPageMap[spanH.id] = toGematria(pageIndex - 1);
              tokenIndex++;
            }

            // שלב 2: מילוי טור שמאלי
            let lCanFit = true;
            while (lCanFit && (tokenIndex < sec.tokens.length || pendingWordTokens)) {
              let currentTok = pendingWordTokens ? pendingWordTokens.token : sec.tokens[tokenIndex];
              const curMode = currentTok.type.startsWith('h') ? headingModes[currentTok.level] : 'inline_2col';

              if (curMode === 'span_1col' && !pendingWordTokens) {
                break;
              }

              const testElem = createElementForToken(currentTok, lCol, lMargin, false, pendingWordTokens, pageNotes);
              if (!testElem) {
                lCanFit = false;
                break;
              }

              lCol.appendChild(testElem);
              if (lCol.scrollHeight > maxH) {
                lCol.removeChild(testElem);
                lCanFit = false;
                break;
              }

              lTokensConsumed++;
              if (currentTok.sideNote && !headingPageMap[currentTok.id]) {
                headingPageMap[currentTok.id] = toGematria(pageIndex - 1);
              }
              if (currentTok.type.startsWith('h') && !headingPageMap[currentTok.id]) {
                headingPageMap[currentTok.id] = toGematria(pageIndex - 1);
              }
              pendingWordTokens = null;
              tokenIndex++;
            }

            // אם נשארו span - הוסף
            while (tokenIndex < sec.tokens.length && sec.tokens[tokenIndex].type.startsWith('h') && headingModes[sec.tokens[tokenIndex].level] === 'span_1col') {
              const spanH = sec.tokens[tokenIndex];
              const spanBlock = document.createElement('div');
              spanBlock.className = 'block-h3-span';
              spanBlock.innerHTML = `<div class="h3-title-text" data-token-id="${spanH.id}">${spanH.text}</div>`;
              page.bodyFlow.appendChild(spanBlock);
              headingPageMap[spanH.id] = toGematria(pageIndex - 1);
              tokenIndex++;
            }

            // אם הגענו לסוף - הוסף עיטור סיום
            if (tokenIndex >= sec.tokens.length && !pendingWordTokens) {
              const divHTML = getSectionDividerHTML(secDivStyle);
              if (divHTML) {
                const divContainer = document.createElement('div');
                divContainer.innerHTML = divHTML;
                page.bodyFlow.appendChild(divContainer.firstElementChild);
              }
            }
          }
        }

        // עדכון מספרי עמודים במפתח
        document.querySelectorAll('.toc-page-num[data-target-id]').forEach(span => {
          const targetId = span.getAttribute('data-target-id');
          if (targetId && headingPageMap[targetId]) {
            span.textContent = headingPageMap[targetId];
          }
        });
      } catch (err) {
        console.error('Error in typesetDocument:', err);
        document.getElementById('book-container').innerHTML = '<div style="padding:20px; color:red;">שגיאה: ' + err.message + '</div>';
      }
    }

    // יצירת אלמנט עבור טוקן (כותרת או פסקה) - מחזיר null אם זה כותרת span
    function createElementForToken(tok, targetCol, targetMargin, isRightCol, pendingWordTokens, pageNotes) {
      if (tok.type.startsWith('h')) {
        const hElem = document.createElement('div');
        hElem.className = 'title-level-' + tok.level;
        hElem.textContent = tok.text;
        hElem.setAttribute('data-token-id', tok.id);
        return hElem;
      }
      // פסקה
      const pElem = document.createElement('p');
      pElem.setAttribute('data-token-id', tok.id);
      pElem.className = 'p-end';
      const words = pendingWordTokens ? pendingWordTokens.remainingWords : tok.text.split(/\s+/);
      const isCont = !!pendingWordTokens;
      pElem.innerHTML = createDropWord(words.join(' '), isCont);

      if (!isCont && tok.sideNote) {
        const noteElem = document.createElement('div');
        noteElem.className = 'side-note-anchor';
        noteElem.textContent = tok.sideNote;
        targetMargin.appendChild(noteElem);
        pageNotes.push({ elem: noteElem, pElem: pElem, col: targetMargin });
      }
      return pElem;
    }

    function buildStructuredTOC(tokenList, showLevels, groupLevels) {
      const entries = [];
      const minGroupLevel = groupLevels.length > 0 ? Math.min(...groupLevels) : 99;
      let currentGroupItems = [];

      function flushGroup() {
        if (currentGroupItems.length > 0) {
          entries.push({ isGroup: true, items: currentGroupItems.slice() });
          currentGroupItems = [];
        }
      }

      tokenList.forEach(t => {
        const lvl = t.type.startsWith('h') ? t.level : (t.sideNote ? 7 : null);
        const txt = t.type.startsWith('h') ? t.text : t.sideNote;
        if (lvl === null || !txt) return;
        if (!showLevels.includes(lvl)) return;
        if (lvl >= minGroupLevel) {
          currentGroupItems.push({ id: t.id, level: lvl, text: txt });
        } else {
          flushGroup();
          entries.push({ id: t.id, level: lvl, text: txt, isGroup: false });
        }
      });
      flushGroup();
      return entries;
    }

    function renderPaginatedTOC(container, entries, titleText, headerRight, startPNum) {
      if (!entries || entries.length === 0) return 0;

      const ITEMS_PAGE_1 = 20;
      const ITEMS_PAGE_REST = 28;
      let curIdx = 0;
      let pagesCount = 0;

      const hdrRType = document.getElementById('hdr-r-type').value;
      const hdrRAlign = document.getElementById('hdr-r-align').value;
      const hdrCType = document.getElementById('hdr-c-type').value;
      const hdrCAlign = document.getElementById('hdr-c-align').value;
      const hdrLType = document.getElementById('hdr-l-type').value;
      const hdrLAlign = document.getElementById('hdr-l-align').value;

      while (curIdx < entries.length) {
        const isFirstTOCPage = (pagesCount === 0);
        const limit = isFirstTOCPage ? ITEMS_PAGE_1 : ITEMS_PAGE_REST;
        const pageItems = entries.slice(curIdx, curIdx + limit);
        curIdx += limit;
        pagesCount++;

        const page = document.createElement('div');
        page.className = 'a4-page toc-page';

        let itemsHTML = '';
        pageItems.forEach(it => {
          if (it.isGroup) {
            const inlineSpans = it.items.map(grp => 
              `<span class="grp-item grp-lvl-${grp.level}"><span class="grp-title">${grp.text}</span> - <span class="grp-page" data-target-id="${grp.id}"></span></span>`
            ).join('<span class="grp-sep">|</span>');
            itemsHTML += `<div class="toc-entry-group"><div class="toc-grouped-block">${inlineSpans}</div></div>`;
          } else {
            itemsHTML += `
              <div class="toc-entry-group">
                <div class="toc-item toc-lvl-${it.level}">
                  <span class="toc-title">${it.text}</span>
                  <span class="toc-dots"></span>
                  <span class="toc-page-num" data-target-id="${it.id}"></span>
                </div>
              </div>
            `;
          }
        });

        const hdrRHTML = renderHeaderSectionHTML(hdrRType, '', '', headerRight);
        const hdrCHTML = renderHeaderSectionHTML(hdrCType, '', '', '');
        const hdrLHTML = renderHeaderSectionHTML(hdrLType, '', '', '');

        page.innerHTML = `
          <div class="page-content-wrapper">
            <div class="top-header-grid">
              <div class="header-col-r" style="text-align:${hdrRAlign};">${hdrRHTML}</div>
              <div class="header-col-c" style="text-align:${hdrCAlign};">${hdrCHTML}</div>
              <div class="header-col-l" style="text-align:${hdrLAlign};">${hdrLHTML}</div>
            </div>
            ${isFirstTOCPage ? `<div class="title-level-2-standalone" style="margin-top: 35px; margin-bottom: 25px;">${titleText}</div>` : ''}
            <div class="toc-grid-full">${itemsHTML}</div>
            <div class="page-spacer"></div>
            <div class="page-number-footer">${toGematria(startPNum + pagesCount - 1)}</div>
          </div>
        `;
        container.appendChild(page);
      }
      return pagesCount;
    }

    async function loadSystemFonts() {
      if ('queryLocalFonts' in window) {
        try {
          const availableFonts = await window.queryLocalFonts();
          const fontFamilies = [...new Set(availableFonts.map(f => f.family))].sort((a, b) => a.localeCompare(b, 'he'));
          if (fontFamilies.length > 0) {
            document.querySelectorAll('.font-picker').forEach(select => {
              const currentVal = select.value;
              select.innerHTML = '';
              const sysGroup = document.createElement('optgroup');
              sysGroup.label = `גופני מחשב (${fontFamilies.length})`;
              fontFamilies.forEach(family => {
                const opt = document.createElement('option');
                opt.value = `'${family}', serif`;
                opt.textContent = family;
                if (currentVal.includes(family)) opt.selected = true;
                sysGroup.appendChild(opt);
              });
              select.appendChild(sysGroup);
            });
            alert(`נטענו ${fontFamilies.length} גופנים מהמחשב!`);
          }
        } catch (err) {
          alert('לא ניתנה הרשאה לגופני המחשב.');
        }
      } else {
        alert('הדפדפן אינו תומך בגישה לגופני המערכת. השתמש ב-Chrome או Edge.');
      }
    }
